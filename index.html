<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Заправки Рядом</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=fb2c860a-11d4-4c8a-9634-414a348a395a&lang=ru_RU" type="text/javascript"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        :root {
            --primary: #0077FF; --primary-dark: #0055CC; --success: #34C759; --danger: #FF3B30;
            --warning: #FF9500; --bg: #F2F3F8; --card-bg: #FFFFFF; --text: #000000;
            --text-secondary: #8E8E93; --border: #E5E5EA; --shadow: rgba(0, 0, 0, 0.08);
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.dark-theme {
            --bg: #1C1C1E; --card-bg: #2C2C2E; --text: #FFFFFF; --text-secondary: #98989D;
            --border: #38383A; --shadow: rgba(0, 0, 0, 0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; padding: 0; transition: var(--transition);
            overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }
        
        /* Header */
        .header { background: var(--card-bg); padding: 15px 20px; box-shadow: 0 2px 10px var(--shadow); position: sticky; top: 0; z-index: 100; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { width: 40px; height: 40px; border: none; background: var(--bg); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; transition: var(--transition); }
        .icon-btn:active { transform: scale(0.9); background: var(--border); }
        
        /* User Bar */
        .user-bar { background: var(--card-bg); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .user-info { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px; position: relative; flex-shrink: 0; }
        .user-level { position: absolute; bottom: -2px; right: -2px; background: var(--warning); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 700; }
        .user-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-id { font-size: 12px; color: var(--text-secondary); }
        .user-points { text-align: right; flex-shrink: 0; }
        .points-value { font-size: 18px; font-weight: 700; color: var(--warning); }
        .points-label { font-size: 11px; color: var(--text-secondary); }
        
        /* Stats Bar */
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 16px; background: var(--card-bg); margin-bottom: 1px; }
        .stat-item { text-align: center; padding: 12px; background: var(--bg); border-radius: 12px; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        
        /* Map */
        .map-container { height: 50vh; min-height: 350px; position: relative; background: #e5e5e5; }
        #map { width: 100%; height: 100%; }
        
        /* Side Panel (Avito-style) */
        .side-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: -4px 0 20px var(--shadow);
            z-index: 1000;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .side-panel.show { right: 0; }
        .side-panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .side-panel-overlay.show { opacity: 1; visibility: visible; }
        
        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: var(--gradient);
            color: white;
        }
        .panel-header-content { flex: 1; }
        .panel-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .panel-address { font-size: 14px; opacity: 0.9; line-height: 1.4; }
        .panel-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .panel-close:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.3); }
        
        .panel-content { flex: 1; overflow-y: auto; padding: 20px; }
        
        /* Fuel Cards (Avito-style) */
        .fuel-card {
            background: var(--bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 2px solid var(--border);
            transition: var(--transition);
            cursor: pointer;
        }
        .fuel-card:active { transform: scale(0.98); background: var(--card-bg); }
        .fuel-card.available { border-color: var(--success); }
        .fuel-card.unavailable { border-color: var(--danger); opacity: 0.7; }
        
        .fuel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .fuel-type { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .fuel-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .fuel-status.available { background: rgba(52, 199, 89, 0.15); color: var(--success); }
        .fuel-status.unavailable { background: rgba(255, 59, 48, 0.15); color: var(--danger); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        
        .fuel-price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .fuel-price { font-size: 28px; font-weight: 700; color: var(--text); }
        .fuel-price-label { font-size: 14px; color: var(--text-secondary); }
        
        .fuel-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
        .fuel-updated::before { content: "🕐 "; }
        .fuel-reports::before { content: " "; }
        
        /* Report Form */
        .report-form { background: var(--bg); border-radius: 16px; padding: 16px; margin-top: 20px; }
        .form-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
        .form-input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; background: var(--card-bg); color: var(--text); transition: var(--transition); }
        .form-input:focus { border-color: var(--primary); }
        .form-textarea { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; background: var(--card-bg); color: var(--text); transition: var(--transition); resize: vertical; min-height: 80px; font-family: inherit; }
        .form-textarea:focus { border-color: var(--primary); }
        
        .radio-group { display: flex; gap: 12px; }
        .radio-option { flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: 12px; text-align: center; cursor: pointer; transition: var(--transition); background: var(--card-bg); font-weight: 600; }
        .radio-option:active { transform: scale(0.95); }
        .radio-option.selected { border-color: var(--success); background: var(--success); color: white; }
        .radio-option.selected.no { border-color: var(--danger); background: var(--danger); }
        
        .btn { padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition); width: 100%; }
        .btn:active { transform: scale(0.98); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-primary { background: var(--primary); color: white; }
        
        /* Comments Section */
        .comments-section { margin-top: 20px; }
        .comments-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
        .comment-item { background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .comment-user { font-size: 13px; font-weight: 600; }
        .comment-time { font-size: 12px; color: var(--text-secondary); }
        .comment-text { font-size: 14px; color: var(--text); line-height: 1.4; }
        .comment-queue { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        
        /* Action Buttons */
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .btn-large { padding: 16px; font-size: 16px; }
        
        /* Bottom Sheet for Mobile */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            box-shadow: 0 -4px 20px var(--shadow);
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 60vh;
            overflow-y: auto;
        }
        .bottom-sheet.show { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
        
        /* Tabs */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
        .tab { padding: 10px 16px; background: var(--bg); border: none; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: var(--transition); }
        .tab.active { background: var(--primary); color: white; }
        
        /* Station List */
        .station-list { padding: 20px; }
        .station-item { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px var(--shadow); cursor: pointer; transition: var(--transition); }
        .station-item:active { transform: scale(0.98); }
        .station-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .station-item-name { font-size: 17px; font-weight: 700; }
        .station-item-distance { font-size: 13px; color: var(--text-secondary); }
        .station-item-address { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
        .station-item-fuel { display: flex; gap: 8px; flex-wrap: wrap; }
        .fuel-tag { padding: 6px 12px; background: var(--bg); border-radius: 8px; font-size: 13px; font-weight: 600; }
        .fuel-tag.available { background: rgba(52, 199, 89, 0.15); color: var(--success); }
        
        /* Toast */
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: var(--card-bg); padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 2000; opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); text-align: center; max-width: 90%; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--success); color: white; }
        .toast.error { background: var(--danger); color: white; }
        
        /* Responsive */
        @media (min-width: 768px) {
            .bottom-sheet { display: none; }
            .side-panel { max-width: 450px; }
        }
        @media (max-width: 767px) {
            .side-panel { display: none; }
            .map-container { height: 40vh; min-height: 300px; }
        }
        
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        .achievement { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: linear-gradient(135deg, #FFD700, #FFA500); color: white; border-radius: 20px; font-size: 12px; font-weight: 600; margin: 4px; animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>

        // ================= ФУНКЦИИ =================
        async function useMyLocation() {
            showToast('📍 Определяем местоположение...');
            
            let gotLocation = false;
            
            try {
                const data = await vkBridge.send('VKWebAppGetLocation');
                if (data && data.lat) { 
                    userCoords = { lat: data.lat, lon: data.lon }; 
                    await searchStationsByCoords(data.lat, data.lon);
                    gotLocation = true;
                }
            } catch (e) {
                console.error('Ошибка VK геолокации:', e);
            }
            
            if (!gotLocation && navigator.geolocation) {
                try {
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 0
                        });
                    });
                    userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
                    await searchStationsByCoords(userCoords.lat, userCoords.lon);
                    gotLocation = true;
                } catch (error) {
                    console.error('Ошибка браузерной геолокации:', error);
                }
            }
            
            if (!gotLocation) {
                userCoords = { lat: 55.7558, lon: 37.6173 };
                await searchStationsByCoords(55.7558, 37.6173);
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        async function searchStationsByCoords(lat, lon) {
            if (myMap) myMap.setCenter([lat, lon], 13);
            
            stations = allStations
                .map(s => ({ ...s, distance: calculateDistance(lat, lon, s.lat, s.lon) }))
                .filter(s => s.distance <= 10)
                .sort((a, b) => a.distance - b.distance);
            
            renderStationsList(stations);
        }

        function timeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'только что';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} мин назад`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ч назад`;
            const days = Math.floor(hours / 24);
            return `${days} дн назад`;
        }

            toast.textContent = message; 
            toast.className = 'toast ' + type; 
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
