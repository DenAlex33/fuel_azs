<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заправки Рядом</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0077FF;
            --primary-dark: #0055CC;
            --success: #34C759;
            --danger: #FF3B30;
            --warning: #FF9500;
            --bg: #F2F3F8;
            --card-bg: #FFFFFF;
            --text: #000000;
            --text-secondary: #8E8E93;
            --border: #E5E5EA;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 0 0 40px 0;
        }

        /* Header */
        .header {
            background: transparent;
            color: white;
            padding: 20px 20px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: -20px auto 0;
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        /* User Card */
        .user-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 600;
        }

        .user-details h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .user-details p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .btn-chat {
            background: rgba(0, 119, 255, 0.1);
            color: var(--primary);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 22px;
            transition: all 0.2s;
        }

        .btn-chat:active {
            transform: scale(0.9);
            background: rgba(0, 119, 255, 0.2);
        }

        /* Search & Fuel Section */
        .controls-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .search-input {
            flex: 1;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: var(--bg);
            color: var(--text);
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 119, 255, 0.08);
        }

        .btn-geo {
            width: 52px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-geo:active {
            background: var(--border);
            transform: scale(0.95);
        }

        .btn-search {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 119, 255, 0.3);
        }

        .btn-search:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 119, 255, 0.4);
        }

        /* Fuel Selector */
        .fuel-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .fuel-card {
            padding: 14px 8px;
            border: 2px solid var(--border);
            background: var(--bg);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .fuel-card.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 119, 255, 0.3);
            transform: translateY(-2px);
        }

        .fuel-icon {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .fuel-name {
            font-size: 12px;
            font-weight: 600;
        }

        /* Map & Stations Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .map-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .map-wrapper {
            border-radius: 16px;
            overflow: hidden;
            height: 300px;
            border: 2px solid var(--border);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .stations-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        /* Station Card */
        .station-item {
            background: var(--bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .station-item:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .station-name {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
            margin-right: 10px;
        }

        .station-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-available {
            background: rgba(52, 199, 89, 0.15);
            color: var(--success);
        }

        .status-unavailable {
            background: rgba(255, 59, 48, 0.15);
            color: var(--danger);
        }

        .status-unknown {
            background: rgba(255, 149, 0, 0.15);
            color: var(--warning);
        }

        .station-address {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .station-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .btn-action {
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-subscribe {
            background: rgba(0, 119, 255, 0.1);
            color: var(--primary);
        }

        .btn-subscribe:active {
            background: rgba(0, 119, 255, 0.2);
        }

        .btn-yes {
            background: rgba(52, 199, 89, 0.15);
            color: var(--success);
        }

        .btn-yes:active {
            background: rgba(52, 199, 89, 0.3);
        }

        .btn-no {
            background: rgba(255, 59, 48, 0.15);
            color: var(--danger);
        }

        .btn-no:active {
            background: rgba(255, 59, 48, 0.3);
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
            gap: 16px;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: white;
            font-size: 15px;
            font-weight: 500;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            text-align: center;
            max-width: 90%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 15px;
            line-height: 1.5;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-item {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .fuel-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 0 12px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>⛽ Заправки Рядом</h1>
        <p>Мониторинг топлива в реальном времени</p>
    </div>

    <div class="container">
        <!-- User Card -->
        <div class="user-card">
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">👤</div>
                <div class="user-details">
                    <h3 id="user-name">Загрузка...</h3>
                    <p>ID: <span id="user-id">...</span></p>
                </div>
            </div>
            <button class="btn-chat" onclick="openChat()" title="Чат с поддержкой"></button>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar" id="stats-bar" style="display: none;">
            <div class="stat-item">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Всего АЗС</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-available">0</div>
                <div class="stat-label">Есть топливо</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-distance">0</div>
                <div class="stat-label">Ближайшая, км</div>
            </div>
        </div>

        <!-- Search & Fuel Controls -->
        <div class="controls-card">
            <div class="section-title">🔍 Поиск АЗС</div>
            <div class="search-row">
                <input
                    type="text"
                    id="city-input"
                    class="search-input"
                    placeholder="Введите город или район..."
                >
                <button class="btn-geo" onclick="useMyLocation()" title="Моё местоположение"></button>
            </div>
            <button class="btn-search" onclick="searchStations()">
                🔍 Найти заправки
            </button>

            <div style="margin-top: 24px;">
                <div class="section-title">⛽ Тип топлива</div>
                <div class="fuel-grid">
                    <div class="fuel-card" data-fuel="ai92" onclick="selectFuel('ai92')">
                        <div class="fuel-icon">92</div>
                        <div class="fuel-name">АИ-92</div>
                    </div>
                    <div class="fuel-card active" data-fuel="ai95" onclick="selectFuel('ai95')">
                        <div class="fuel-icon">95</div>
                        <div class="fuel-name">АИ-95</div>
                    </div>
                    <div class="fuel-card" data-fuel="ai100" onclick="selectFuel('ai100')">
                        <div class="fuel-icon">100</div>
                        <div class="fuel-name">АИ-100</div>
                    </div>
                    <div class="fuel-card" data-fuel="dt" onclick="selectFuel('dt')">
                        <div class="fuel-icon">ДТ</div>
                        <div class="fuel-name">Дизель</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Map -->
        <div class="map-card">
            <div class="section-title">🗺️ Карта</div>
            <div class="map-wrapper">
                <div id="map"></div>
            </div>
        </div>

        <!-- Stations List -->
        <div class="stations-card" id="stations-list" style="display: none;">
            <div class="section-title">📍 Найденные АЗС</div>
            <div id="stations-content"></div>
        </div>
    </div>

    <!-- Loading -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Ищем заправки...</div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        let myMap;
        let selectedFuel = 'ai95';
        let userData = null;
        let userCoords = null;
        const BACKEND_URL = 'http://localhost:8000'; // Замени на свой URL когда будет бэкенд

        // Инициализация
        vkBridge.send('VKWebAppInit').then(() => {
            return vkBridge.send('VKWebAppGetUserInfo');
        }).then((data) => {
            if (data) {
                userData = data;
                document.getElementById('user-name').textContent = `${data.first_name} ${data.last_name}`;
                document.getElementById('user-id').textContent = data.id;
                document.getElementById('user-avatar').textContent = `${data.first_name[0]}${data.last_name[0]}`;
            }
            initMap();
        }).catch(() => {
            document.getElementById('user-name').textContent = 'Гость';
            initMap();
        });

        function initMap() {
            ymaps.ready(function () {
                myMap = new ymaps.Map("map", {
                    center: [55.751244, 37.618423], // Москва по умолчанию
                    zoom: 10,
                    controls: ['zoomControl', 'geolocationControl']
                });
            });
        }

        function selectFuel(fuelType) {
            selectedFuel = fuelType;
            document.querySelectorAll('.fuel-card').forEach(c => c.classList.remove('active'));
            document.querySelector(`[data-fuel="${fuelType}"]`).classList.add('active');
        }

        async function useMyLocation() {
            showToast(' Определяем местоположение...', '');
            
            // Пробуем через VK Bridge
            try {
                const data = await vkBridge.send('VKWebAppGetLocation');
                if (data && data.lat) {
                    userCoords = { lat: data.lat, lon: data.lon };
                    document.getElementById('city-input').value = 'Моё местоположение';
                    searchStationsByCoords(data.lat, data.lon);
                    return;
                }
            } catch (e) {
                console.log('VK Geolocation failed');
            }

            // Пробуем через браузер
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userCoords = { 
                            lat: position.coords.latitude, 
                            lon: position.coords.longitude 
                        };
                        document.getElementById('city-input').value = 'Моё местоположение';
                        searchStationsByCoords(position.coords.latitude, position.coords.longitude);
                    },
                    () => showToast('Не удалось определить местоположение', 'error'),
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                showToast('Геолокация не поддерживается', 'error');
            }
        }

        async function searchStations() {
            const city = document.getElementById('city-input').value.trim();
            if (!city) {
                showToast('Введите название города', 'error');
                return;
            }
            if (city === 'Моё местоположение') return;

            document.getElementById('loading').classList.add('show');
            document.getElementById('stations-list').style.display = 'none';

            try {
                // Пытаемся получить координаты города через геокодер Яндекса
                const response = await fetch(`https://geocode-maps.yandex.ru/1.x/?apikey=YOUR_API_KEY&geocode=${encodeURIComponent(city)}&format=json`);
                // Если нет API ключа, используем демо-данные
                if (!response.ok) {
                    throw new Error('No API key');
                }
                const data = await response.json();
                const coords = data.response.GeoObjectCollection.featureMember[0]?.GeoObject?.Point?.pos.split(' ');
                
                if (coords) {
                    const [lon, lat] = coords;
                    await searchStationsByCoords(parseFloat(lat), parseFloat(lon));
                } else {
                    throw new Error('City not found');
                }
            } catch (error) {
                console.warn('Using demo mode');
                showToast('🎨 Демо-режим: тестовые данные', 'success');
                displayStations(getMockStations());
            } finally {
                document.getElementById('loading').classList.remove('show');
            }
        }

        async function searchStationsByCoords(lat, lon) {
            document.getElementById('loading').classList.add('show');
            document.getElementById('stations-list').style.display = 'none';

            try {
                // Центрируем карту на местоположении пользователя
                if (myMap) {
                    myMap.setCenter([lat, lon], 13);
                }

                // Увеличенный радиус поиска - 5 км
                const radius = 5000; // метров
                
                // Запрос к бэкенду (если есть)
                try {
                    const response = await fetch(`${BACKEND_URL}/api/stations/nearby?lat=${lat}&lon=${lon}&radius=${radius}&fuel=${selectedFuel}`);
                    if (response.ok) {
                        const stations = await response.json();
                        displayStations(stations);
                        return;
                    }
                } catch (e) {
                    console.log('Backend not available');
                }

                // Демо-данные с улучшенной логикой (больше заправок)
                showToast(' Ищем заправки в радиусе 5 км...', '');
                setTimeout(() => {
                    const stations = getEnhancedMockStations(lat, lon);
                    displayStations(stations);
                    document.getElementById('loading').classList.remove('show');
                }, 1500);
            } catch (error) {
                document.getElementById('loading').classList.remove('show');
                showToast('Ошибка поиска', 'error');
            }
        }

        // Улучшенные демо-данные (больше заправок)
        function getEnhancedMockStations(centerLat, centerLon) {
            const stations = [
                { id: '1', name: 'Лукойл', address: 'МКАД 2 км, вл5', lat: centerLat + 0.01, lon: centerLon + 0.01, status: 'available', distance: 1.2 },
                { id: '2', name: 'Газпромнефть', address: 'ул. Победы, 29', lat: centerLat - 0.01, lon: centerLon - 0.01, status: 'unknown', distance: 2.5 },
                { id: '3', name: 'Татнефть', address: 'Носовихинское ш., 31в', lat: centerLat + 0.02, lon: centerLon - 0.02, status: 'unavailable', distance: 3.1 },
                { id: '4', name: 'Роснефть', address: 'ш. Энтузиастов, 56', lat: centerLat - 0.02, lon: centerLon + 0.02, status: 'available', distance: 3.8 },
                { id: '5', name: 'Shell', address: 'Ленинский пр-т, 125', lat: centerLat + 0.015, lon: centerLon + 0.015, status: 'available', distance: 2.1 },
                { id: '6', name: 'BP', address: 'Варшавское ш., 95', lat: centerLat - 0.015, lon: centerLon + 0.01, status: 'unknown', distance: 4.2 },
            ];
            
            // Добавляем случайные заправки для реалистичности
            for (let i = 7; i <= 12; i++) {
                const offsetLat = (Math.random() - 0.5) * 0.05;
                const offsetLon = (Math.random() - 0.5) * 0.05;
                const statuses = ['available', 'unavailable', 'unknown'];
                const names = ['Лукойл', 'Газпромнефть', 'Татнефть', 'Роснефть', 'Shell'];
                
                stations.push({
                    id: i.toString(),
                    name: names[Math.floor(Math.random() * names.length)],
                    address: `ул. Примерная, ${Math.floor(Math.random() * 100)}`,
                    lat: centerLat + offsetLat,
                    lon: centerLon + offsetLon,
                    status: statuses[Math.floor(Math.random() * statuses.length)],
                    distance: (Math.random() * 5).toFixed(1)
                });
            }
            
            return stations.sort((a, b) => a.distance - b.distance);
        }

        function displayStations(stations) {
            const container = document.getElementById('stations-content');
            container.innerHTML = '';

            if (!stations || stations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-text">В этом районе АЗС не найдены.<br>Попробуйте изменить запрос.</div>
                    </div>`;
                document.getElementById('stations-list').style.display = 'block';
                return;
            }

            // Обновляем статистику
            document.getElementById('stat-total').textContent = stations.length;
            document.getElementById('stat-available').textContent = stations.filter(s => s.status === 'available').length;
            document.getElementById('stat-distance').textContent = stations[0]?.distance || '0';
            document.getElementById('stats-bar').style.display = 'grid';

            // Очищаем карту от старых меток
            if (myMap) {
                myMap.geoObjects.removeAll();
            }

            stations.forEach((station) => {
                const card = document.createElement('div');
                card.className = 'station-item';

                const statusText = station.status === 'available' ? '✅ ЕСТЬ' :
                                   station.status === 'unavailable' ? '❌ НЕТ' : '❓ НЕТ ДАННЫХ';
                const statusClass = `status-${station.status || 'unknown'}`;

                card.innerHTML = `
                    <div class="station-header">
                        <div class="station-name">${station.name}</div>
                        <span class="station-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="station-address">📍 ${station.address} (${station.distance} км)</div>
                    <div class="station-actions">
                        <button class="btn-action btn-subscribe" onclick="subscribe('${station.id}', '${station.name}')">
                             Подписка
                        </button>
                        <button class="btn-action btn-yes" onclick="reportFuel('${station.id}', 'available')">
                            ✅ Есть
                        </button>
                        <button class="btn-action btn-no" onclick="reportFuel('${station.id}', 'unavailable')">
                            ❌ Нет
                        </button>
                    </div>
                `;
                container.appendChild(card);

                // Добавляем метку на карту
                if (myMap && station.lat && station.lon) {
                    const color = station.status === 'available' ? 'green' :
                                  station.status === 'unavailable' ? 'red' : 'blue';
                    const placemark = new ymaps.Placemark(
                        [station.lat, station.lon],
                        { 
                            hintContent: station.name, 
                            balloonContent: `<b>${station.name}</b><br>${station.address}<br>${statusText}` 
                        },
                        { 
                            preset: `islands#${color}GasStationIcon`,
                            iconCaption: station.name
                        }
                    );
                    myMap.geoObjects.add(placemark);
                }
            });

            document.getElementById('stations-list').style.display = 'block';
            
            // Если есть метки, показываем их все на карте
            if (stations.length > 0 && myMap) {
                const bounds = myMap.geoObjects.getBounds();
                if (bounds) {
                    myMap.setBounds(bounds, {
                        checkZoomRange: true,
                        zoomMargin: 50
                    });
                }
            }
        }

        function subscribe(stationId, stationName) {
            if (!userData) {
                showToast('Сначала войдите через VK', 'error');
                return;
            }
            showToast(`✅ Вы подписались на: ${stationName}`, 'success');
            // Здесь будет отправка на бэкенд
        }

        async function reportFuel(stationId, status) {
            if (!userData) {
                showToast('Сначала войдите через VK', 'error');
                return;
            }
            
            try {
                // Отправка на бэкенд
                const response = await fetch(`${BACKEND_URL}/api/report`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        vk_id: userData.id, 
                        station_id: stationId, 
                        fuel_type: selectedFuel, 
                        status: status 
                    })
                });
                
                if (response.ok) {
                    showToast('✅ Спасибо! Ваш отчёт принят.', 'success');
                    // Обновляем список
                    if (userCoords) {
                        searchStationsByCoords(userCoords.lat, userCoords.lon);
                    }
                } else {
                    throw new Error();
                }
            } catch (error) {
                showToast('✅ Отчёт сохранён (демо)', 'success');
            }
        }

        function openChat() {
            // Открываем сообщения сообщества VK
            vkBridge.send('VKWebAppOpenCommunityMessages', { 
                group_id: 241157642 // Замени на ID твоего сообщества
            }).catch(() => {
                // Если не получилось, показываем альтернативу
                showToast('Откройте сообщения вручную в VK', 'error');
            });
        }

        function getMockStations() {
            return [
                { id: '1', name: 'Лукойл', address: 'МКАД 2 км, вл5', lat: 55.752, lon: 37.574, status: 'available' },
                { id: '2', name: 'Газпромнефть', address: 'ул. Победы, 29', lat: 55.750, lon: 37.572, status: 'unknown' },
                { id: '3', name: 'Татнефть', address: 'Носовихинское ш., 31в', lat: 55.753, lon: 37.576, status: 'unavailable' }
            ];
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Обработка Enter в поле поиска
        document.getElementById('city-input')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchStations();
        });
    </script>
</body>
</html>
