<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Заправки Рядом</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=fb2c860a-11d4-4c8a-9634-414a348a395a&lang=ru_RU" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        :root {
            --primary: #0077FF; --primary-dark: #0055CC; --success: #34C759; --danger: #FF3B30;
            --warning: #FF9500; --bg: #F2F3F8; --card-bg: #FFFFFF; --text: #000000;
            --text-secondary: #8E8E93; --border: #E5E5EA; --shadow: rgba(0, 0, 0, 0.08);
            --shadow-hover: rgba(0, 0, 0, 0.15); --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.dark-theme {
            --bg: #1C1C1E; --card-bg: #2C2C2E; --text: #FFFFFF; --text-secondary: #98989D;
            --border: #38383A; --shadow: rgba(0, 0, 0, 0.3); --shadow-hover: rgba(0, 0, 0, 0.5);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 0 40px 0; transition: var(--transition);
            overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }
        .header { background: var(--card-bg); padding: 15px 20px; box-shadow: 0 2px 10px var(--shadow); position: sticky; top: 0; z-index: 100; transition: var(--transition); }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { width: 40px; height: 40px; border: none; background: var(--bg); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; transition: var(--transition); }
        .icon-btn:active { transform: scale(0.9); background: var(--border); }
        .user-bar { background: var(--card-bg); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); transition: var(--transition); }
        .user-info { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px; position: relative; flex-shrink: 0; }
        .user-level { position: absolute; bottom: -2px; right: -2px; background: var(--warning); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 700; }
        .user-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-id { font-size: 12px; color: var(--text-secondary); }
        .user-points { text-align: right; flex-shrink: 0; }
        .points-value { font-size: 18px; font-weight: 700; color: var(--warning); }
        .points-label { font-size: 11px; color: var(--text-secondary); }
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 16px; background: var(--card-bg); margin-bottom: 1px; transition: var(--transition); }
        .stat-item { text-align: center; padding: 12px; background: var(--bg); border-radius: 12px; transition: var(--transition); }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        .map-container { height: 40vh; min-height: 300px; position: relative; background: #e5e5e5; border-radius: 0 0 20px 20px; overflow: hidden; }
        #map { width: 100%; height: 100%; }
        .bottom-sheet { background: var(--card-bg); border-radius: 20px 20px 0 0; margin-top: -20px; padding: 20px; box-shadow: 0 -4px 20px var(--shadow); max-height: 60vh; overflow-y: auto; transition: var(--transition); -webkit-overflow-scrolling: touch; }
        .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
        .tab { padding: 10px 16px; background: var(--bg); border: none; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: var(--transition); }
        .tab.active { background: var(--primary); color: white; }
        .tab:active { transform: scale(0.95); }
        .search-section { margin-bottom: 20px; }
        .search-input { width: 100%; padding: 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; background: var(--bg); color: var(--text); transition: var(--transition); }
        .search-input:focus { border-color: var(--primary); background: var(--card-bg); }
        .btn { padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition); width: 100%; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; margin-top: 10px; }
        .btn-primary:active { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: white; margin-top: 10px; }
        .btn-danger { background: var(--danger); color: white; margin-top: 10px; }
        .fuel-selector { margin-bottom: 20px; }
        .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .fuel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .fuel-card { padding: 12px; border: 2px solid var(--border); border-radius: 12px; text-align: center; cursor: pointer; transition: var(--transition); background: var(--card-bg); }
        .fuel-card:active { transform: scale(0.95); }
        .fuel-card.active { border-color: var(--primary); background: var(--primary); color: white; }
        .fuel-card .fuel-num { font-weight: 700; font-size: 18px; }
        .fuel-card .fuel-name { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .fuel-card.active .fuel-name { color: rgba(255, 255, 255, 0.9); }
        .filters-section { margin-bottom: 20px; }
        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-chip { padding: 8px 14px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 20px; font-size: 13px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 6px; }
        .filter-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
        .filter-chip:active { transform: scale(0.95); }
        .station-card { background: var(--card-bg); border-radius: 16px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 2px 12px var(--shadow); transition: var(--transition); position: relative; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .station-card:active { transform: scale(0.98); }
        .station-card.favorite { border: 2px solid var(--warning); }
        .favorite-badge { position: absolute; top: 12px; right: 12px; background: var(--warning); color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; z-index: 10; }
        .station-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .station-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
        .station-logo { width: 48px; height: 48px; border-radius: 12px; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 18px; flex-shrink: 0; }
        .station-info { flex: 1; min-width: 0; }
        .station-name { font-size: 17px; font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .station-address { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }
        .station-distance { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .station-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        .fuel-list { padding: 16px; }
        .fuel-item { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; transition: var(--transition); cursor: pointer; }
        .fuel-item:active { background: var(--bg); }
        .fuel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .fuel-name { font-size: 16px; font-weight: 600; }
        .fuel-status { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.unavailable { background: var(--danger); }
        .status-dot.available { background: var(--success); }
        .fuel-meta { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
        .fuel-footer { display: flex; justify-content: space-between; align-items: center; }
        .fuel-limit { font-size: 13px; color: var(--text-secondary); }
        .fuel-price { font-size: 20px; font-weight: 700; color: var(--text); }
        .price-change { font-size: 12px; margin-left: 8px; }
        .price-up { color: var(--danger); }
        .price-down { color: var(--success); }
        .chart-container { padding: 16px; height: 200px; margin-top: 12px; }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        .achievement { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: linear-gradient(135deg, #FFD700, #FFA500); color: white; border-radius: 20px; font-size: 12px; font-weight: 600; margin: 4px; animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: var(--card-bg); padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 2000; opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); text-align: center; max-width: 90%; box-shadow: 0 8px 30px var(--shadow-hover); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--success); color: white; }
        .toast.error { background: var(--danger); color: white; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(0, 119, 255, 0.4); } 50% { box-shadow: 0 0 0 10px rgba(0, 119, 255, 0); } }
        .quick-actions { display: flex; gap: 8px; padding: 12px 16px; background: var(--bg); border-top: 1px solid var(--border); }
        .quick-action { flex: 1; padding: 10px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; text-align: center; font-size: 12px; cursor: pointer; transition: var(--transition); }
        .quick-action:active { transform: scale(0.95); background: var(--border); }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-content { background: var(--card-bg); border-radius: 20px 20px 0 0; padding: 20px; width: 100%; max-height: 80vh; overflow-y: auto; animation: slideUp 0.3s ease-out; -webkit-overflow-scrolling: touch; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
        .form-input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; background: var(--bg); color: var(--text); transition: var(--transition); }
        .form-input:focus { border-color: var(--primary); background: var(--card-bg); }
        .form-textarea { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; background: var(--bg); color: var(--text); transition: var(--transition); resize: vertical; min-height: 80px; font-family: inherit; }
        .form-textarea:focus { border-color: var(--primary); background: var(--card-bg); }
        .radio-group { display: flex; gap: 12px; }
        .radio-option { flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: 12px; text-align: center; cursor: pointer; transition: var(--transition); background: var(--card-bg); }
        .radio-option:active { transform: scale(0.95); }
        .radio-option.selected { border-color: var(--primary); background: var(--primary); color: white; }
        .report-item { background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .report-user { font-size: 13px; font-weight: 600; }
        .report-time { font-size: 12px; color: var(--text-secondary); }
        .report-content { font-size: 14px; color: var(--text); }
        .report-actions { display: flex; gap: 8px; margin-top: 8px; }
        .report-btn { padding: 6px 12px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; cursor: pointer; transition: var(--transition); }
        .report-btn:active { transform: scale(0.95); }
        .report-btn.liked { background: var(--primary); color: white; border-color: var(--primary); }
        
        @media (max-width: 600px) {
            .fuel-grid { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 18px; }
            .stats-bar { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .stat-item { padding: 8px; }
            .stat-value { font-size: 20px; }
            .map-container { height: 35vh; min-height: 250px; }
            .bottom-sheet { padding: 16px; }
            .station-actions { grid-template-columns: 1fr; }
            .quick-actions { flex-wrap: wrap; }
            .quick-action { flex: 1 1 calc(50% - 4px); min-width: 100px; }
        }
        
        @media (max-width: 400px) {
            .fuel-grid { grid-template-columns: repeat(2, 1fr); }
            .user-name { font-size: 14px; }
            .points-value { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>⛽ Заправки Рядом</h1>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()" title="Тема"></button>
                <button class="icon-btn" onclick="openAddStationModal()" title="Добавить АЗС">➕</button>
            </div>
        </div>
    </div>

    <div class="user-bar">
        <div class="user-info">
            <div class="user-avatar" id="user-avatar">👤<span class="user-level" id="user-level">1</span></div>
            <div style="min-width: 0;">
                <div class="user-name" id="user-name">Загрузка...</div>
                <div class="user-id" id="user-id">...</div>
            </div>
        </div>
        <div class="user-points">
            <div class="points-value" id="user-points">0</div>
            <div class="points-label">баллов</div>

    <div id="achievements" style="padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 4px;"></div>

    <div class="stats-bar" id="stats-bar">

        <div class="stat-item"><div class="stat-value" id="stat-available">0</div><div class="stat-label">Есть топливо</div></div>
        <div class="stat-item"><div class="stat-value" id="stat-reports">0</div><div class="stat-label">Отчётов</div></div>
    </div>

    <div class="map-container" id="map-container">
        <div id="map"></div>
    </div>

    <div class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('search')"> Поиск</button>
            <button class="tab" onclick="switchTab('favorites')">❤️ Избранное</button>
            <button class="tab" onclick="switchTab('history')">📈 История</button>
            <button class="tab" onclick="switchTab('achievements')">🏆 Достижения</button>
        </div>

        <div id="tab-search">
            <div class="search-section">
                <input type="text" id="city-input" class="search-input" placeholder=" Поиск АЗС...">
                <button onclick="useMyLocation()" class="btn btn-primary">📍 Моё местоположение</button>
            </div>
            <div class="fuel-selector">
                <div class="section-title">Тип топлива</div>
                <div class="fuel-grid">
                    <div class="fuel-card" data-fuel="ai92" onclick="selectFuel('ai92')"><div class="fuel-num">92</div><div class="fuel-name">АИ-92</div></div>
                    <div class="fuel-card active" data-fuel="ai95" onclick="selectFuel('ai95')"><div class="fuel-num">95</div><div class="fuel-name">АИ-95</div></div>
                    <div class="fuel-card" data-fuel="ai100" onclick="selectFuel('ai100')"><div class="fuel-num">100</div><div class="fuel-name">АИ-100</div></div>
                    <div class="fuel-card" data-fuel="dt" onclick="selectFuel('dt')"><div class="fuel-num">ДТ</div><div class="fuel-name">Дизель</div></div>
                </div>
            </div>
            <div class="filters-section">
                <div class="section-title">Фильтры</div>
                <div class="filter-row">
                    <div class="filter-chip active" data-filter="distance" onclick="toggleFilter('distance')">📏 По расстоянию</div>
                    <div class="filter-chip" data-filter="price" onclick="toggleFilter('price')">💰 По цене</div>
                    <div class="filter-chip" data-filter="available" onclick="toggleFilter('available')">✅ Только с топливом</div>
                </div>
            </div>
            <div id="stations-content"><div class="loading">Нажмите "Моё местоположение" для поиска</div></div>
        </div>

        <div id="tab-favorites" style="display: none;">
            <div class="section-title">Избранные АЗС</div>
            <div id="favorites-content"><div class="loading">У вас пока нет избранных АЗС</div></div>
        </div>

        <div id="tab-history" style="display: none;">
            <div class="section-title">История цен</div>
            <div class="chart-container"><canvas id="priceChart"></canvas></div>
            <div id="history-content" style="padding: 16px;"></div>
        </div>

        <div id="tab-achievements" style="display: none;">
            <div class="section-title">Ваши достижения</div>
            <div id="achievements-content" style="padding: 16px;"></div>
        </div>
    </div>

    <!-- Модальное окно для отчёта -->
    <div class="modal" id="report-modal">
        <div class="modal-content" id="report-modal-content"></div>
    </div>

    <!-- Модальное окно для добавления АЗС -->
    <div class="modal" id="add-station-modal">
        <div class="modal-content" id="add-station-modal-content"></div>
    </div>

    <!-- Модальное окно деталей станции -->
    <div class="modal" id="station-modal">
        <div class="modal-content" id="station-modal-content"></div>
    </div>

    <div id="toast" class="toast"></div>

                    userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
                    showToast(`📍 Найдено: ${userCoords.lat.toFixed(4)}, ${userCoords.lon.toFixed(4)}`);

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        async function searchStationsByCoords(lat, lon) {
            if (myMap) myMap.setCenter([lat, lon], 13);

                .map(s => ({ ...s, distance: calculateDistance(lat, lon, s.lat, s.lon) }))
                .filter(s => s.distance <= 10)
                .sort((a, b) => a.distance - b.distance);
            
            displayStations(stations);
        }

        function timeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'только что';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} мин назад`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ч назад`;
            const days = Math.floor(hours / 24);
            return `${days} дн назад`;
        }

        function renderPriceHistory() {
            const container = document.getElementById('history-content');
            if (!container) return;
            
            // Собираем историю цен из отчётов пользователя
            const myReports = userReports.filter(r => r.fuelType === selectedFuel);
            
            if (myReports.length === 0) {
                container.innerHTML = '<div class="loading">📊 Вы ещё не добавляли отчёты. Добавьте первый отчёт о цене!</div>';
                return;
            }

            // Группируем по дням
            const priceHistory = {};
            myReports.forEach(r => {
                const date = new Date(r.timestamp).toLocaleDateString('ru-RU');
                if (!priceHistory[date]) priceHistory[date] = [];
                priceHistory[date].push(r.price);
            });

            const labels = Object.keys(priceHistory).sort();
            const prices = labels.map(date => {
                const pricesOnDate = priceHistory[date];
                return pricesOnDate.reduce((a, b) => a + b, 0) / pricesOnDate.length;
            });

            if (priceChart) priceChart.destroy();

            const ctx = document.getElementById('priceChart').getContext('2d');
            const isDark = document.body.classList.contains('dark-theme');
            const textColor = isDark ? '#FFFFFF' : '#000000';
            const gridColor = isDark ? '#38383A' : '#E5E5EA';

            priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `Цена ${selectedFuel.toUpperCase()}, ₽`,
                        data: prices,
                        borderColor: '#0077FF',
                        backgroundColor: 'rgba(0, 119, 255, 0.1)',
                        borderWidth: 2, fill: true, tension: 0.4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: textColor } } },
                    scales: {
                        y: { ticks: { color: textColor }, grid: { color: gridColor }, beginAtZero: false },
                        x: { ticks: { color: textColor }, grid: { color: gridColor } }
                    }
                }
            });

            const minPrice = Math.min(...prices).toFixed(2);
            const maxPrice = Math.max(...prices).toFixed(2);
            container.innerHTML = `
                <div style="margin-top: 20px;">
                    <div class="section-title">Ваша статистика</div>
                    <div style="padding: 12px; background: var(--bg); border-radius: 12px;">
                        <div style="font-weight: 600; color: var(--success);">Минимальная цена: ${minPrice} ₽</div>
                        <div style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Максимальная цена: ${maxPrice} ₽</div>
                        <div style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Всего отчётов: ${myReports.length}</div>
                    </div>
                </div>`;
        }

                    <select id="report-queue" class="form-input">
                        <option value="no_queue">Нет очереди</option>
                        <option value="small">Маленькая (1-3 машины)</option>
                        <option value="medium">Средняя (4-7 машин)</option>
                        <option value="large">Большая (8+ машин)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Комментарий (необязательно)</label>
                    <textarea id="report-comment" class="form-textarea" placeholder="Например: работает только 2 колонки"></textarea>
                </div>
                
                <button class="btn btn-success" onclick="submitReport('${stationId}')">✅ Отправить отчёт (+10 баллов)</button>
                <button class="btn" style="background: var(--bg); margin-top: 10px;" onclick="closeReportModal()">Отмена</button>
            `;
            
            modal.classList.add('show');
        }

        function selectReportType(type, element) {
            document.querySelectorAll('.radio-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
        }

        function submitReport(stationId) {
            const station = allStations.find(s => s.id === stationId);
            if (!station) return;

            const priceInput = document.getElementById('report-price');
            const queueSelect = document.getElementById('report-queue');
            const commentInput = document.getElementById('report-comment');
            const selectedType = document.querySelector('.radio-option.selected');

            const price = parseFloat(priceInput.value);
            const queue = queueSelect.value;
            const comment = commentInput.value.trim();
            const isAvailable = selectedType?.textContent.includes('Есть') || station.fuels[selectedFuel]?.available;

            if (isNaN(price) || price <= 0) {
                showToast('❌ Введите корректную цену', 'error');
                return;
            }

            // Обновляем данные станции
            station.fuels[selectedFuel] = {
                price: price,
                available: isAvailable,
                updated: Date.now()
            };

            // Добавляем отчёт
            const report = {
                stationId: stationId,
                userId: userData?.id || 'guest',
                fuelType: selectedFuel,
                status: isAvailable ? 'available' : 'unavailable',
                price: price,
                queue: queue,
                comment: comment,
                timestamp: Date.now()
            };

            if (!station.reports) station.reports = [];
            station.reports.push(report);
            userReports.push(report);

            // Сохраняем
            storage.set('allStations', allStations);
            storage.set('userReports', userReports);

            // Начисляем баллы
            addPoints(10);
            userProfile.reports++;
            if (userProfile.reports === 1) unlockAchievement('first_report');
            if (userProfile.reports === 10) unlockAchievement('10_reports');
            storage.set('userProfile', userProfile);

            closeReportModal();
            showToast('✅ Отчёт отправлен! +10 баллов', 'success');
            
            if (stations.length > 0) displayStations(stations);
            loadStationsOnMap();
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.remove('show');
        }

        function openAddStationModal() {
            const modal = document.getElementById('add-station-modal');
            const content = document.getElementById('add-station-modal-content');
            
            content.innerHTML = `
                <div style="text-align: center; margin-bottom: 20px;">
                    <h2 style="font-size: 24px; margin-bottom: 4px;"> Добавить АЗС</h2>
                    <div style="color: var(--text-secondary);">Помогите другим водителям!</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Название АЗС</label>
                    <input type="text" id="new-station-name" class="form-input" placeholder="Например: Лукойл">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Адрес</label>
                    <input type="text" id="new-station-address" class="form-input" placeholder="Введите адрес">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Координаты (широта, долгота)</label>
                    <input type="text" id="new-station-coords" class="form-input" placeholder="55.751244, 37.618423">
                    <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Можно получить в Яндекс Картах</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Доступное топливо</label>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
                        <label style="display: flex; align-items: center; gap: 8px; padding: 12px; background: var(--bg); border-radius: 12px; cursor: pointer;">
                            <input type="checkbox" id="fuel-ai92" checked> АИ-92
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; padding: 12px; background: var(--bg); border-radius: 12px; cursor: pointer;">
                            <input type="checkbox" id="fuel-ai95" checked> АИ-95
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; padding: 12px; background: var(--bg); border-radius: 12px; cursor: pointer;">
                            <input type="checkbox" id="fuel-ai100"> АИ-100
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; padding: 12px; background: var(--bg); border-radius: 12px; cursor: pointer;">
                            <input type="checkbox" id="fuel-dt" checked> Дизель
                        </label>
                    </div>
                </div>
                
                <button class="btn btn-success" onclick="submitNewStation()">✅ Добавить АЗС (+20 баллов)</button>
                <button class="btn" style="background: var(--bg); margin-top: 10px;" onclick="closeAddStationModal()">Отмена</button>
            `;
            
            modal.classList.add('show');
        }

        function submitNewStation() {
            const name = document.getElementById('new-station-name').value.trim();
            const address = document.getElementById('new-station-address').value.trim();
            const coords = document.getElementById('new-station-coords').value.trim();
            
            if (!name || !address || !coords) {
                showToast('❌ Заполните все поля', 'error');
                return;
            }

            const [lat, lon] = coords.split(',').map(c => parseFloat(c.trim()));
            if (isNaN(lat) || isNaN(lon)) {
                showToast('❌ Неверный формат координат', 'error');
                return;
            }

            const fuels = {};
            const basePrices = { ai92: 63.99, ai95: 69.69, ai100: 79.99, dt: 75.50 };
            
            ['ai92', 'ai95', 'ai100', 'dt'].forEach(fuelType => {
                const checkbox = document.getElementById(`fuel-${fuelType}`);
                if (checkbox && checkbox.checked) {
                    fuels[fuelType] = {
                        price: basePrices[fuelType],
                        available: true,
                        updated: Date.now()
                    };
                }
            });

            const newStation = {
                id: `station_${Date.now()}`,
                name: name,
                address: address,
                lat: lat,
                lon: lon,
                fuels: fuels,
                reports: [],
                rating: 5.0,
                addedBy: userData?.id || 'guest',
                addedAt: Date.now()
            };

            allStations.push(newStation);
            storage.set('allStations', allStations);

            addPoints(20);
            unlockAchievement('explorer');

            closeAddStationModal();
            showToast('✅ АЗС добавлена! +20 баллов', 'success');
            
            if (userCoords) searchStationsByCoords(userCoords.lat, userCoords.lon);
            loadStationsOnMap();
        }

        function closeAddStationModal() {
            document.getElementById('add-station-modal').classList.remove('show');
        }

        function navigateTo(address, lat, lon) {
            const yandexMapsUrl = `https://yandex.ru/maps/?rtext=${userCoords?.lat || 55.7558},${userCoords?.lon || 37.6173}~${lat},${lon}&rtt=auto`;
            vkBridge.send('VKWebAppOpenLink', { link: yandexMapsUrl }).catch(() => {
                window.open(yandexMapsUrl, '_blank');
            });
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message; 
            toast.className = 'toast ' + type; 
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Закрытие модалок по клику вне контента
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('show');
            });
        });

        const cityInput = document.getElementById('city-input');
        if (cityInput) {
            cityInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') { 
                    const city = this.value.trim(); 
                    if (city) showToast(`🔍 Ищем: ${city}`); 
                }
            });
        }
    </script>
</body>
</html>
