<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заправки Рядом</title>
    <!-- Правильная и актуальная ссылка на VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--vkui--color_background_primary, #ffffff);
            color: var(--vkui--color_text_primary, #000000);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: #0077FF;
            margin-bottom: 10px;
            font-size: 22px;
            text-align: center;
        }
        p {
            text-align: center;
            color: #818c99;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .btn {
            background: #0077FF;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
            max-width: 300px;
            transition: background 0.2s;
        }
        .btn:active {
            background: #0055CC;
            transform: scale(0.98);
        }
        .btn-secondary {
            background: #e5ebf1;
            color: #0077FF;
        }
        .btn-secondary:active {
            background: #dce1e6;
        }
        #debug-box {
            margin-top: 30px;
            padding: 12px;
            background: #f0f2f5;
            border-radius: 8px;
            font-size: 12px;
            color: #333;
            width: 100%;
            max-width: 300px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>⛽ Заправки Рядом</h1>
    <p>Мониторинг наличия топлива на АЗС через VK</p>
    
    <button class="btn" onclick="openBot()">💬 Открыть чат с ботом</button>
    <button class="btn btn-secondary" onclick="showMap()">🗺️ Карта АЗС (скоро)</button>
    
    <div id="debug-box">
        <strong>Статус:</strong> <span id="status-text">Инициализация...</span>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        const debugBox = document.getElementById('debug-box');

        // Проверяем, загрузилась ли библиотека
        if (typeof vkBridge === 'undefined') {
            statusText.textContent = '❌ Ошибка: VK Bridge не загрузился!';
            statusText.style.color = 'red';
        } else {
            statusText.textContent = '✅ Библиотека загружена. Подключаемся...';
            
            // Инициализация Mini App
            vkBridge.send('VKWebAppInit')
                .then(() => {
                    statusText.textContent = '✅ Приложение успешно запущено!';
                    statusText.style.color = 'green';
                    
                    // Пытаемся получить данные пользователя
                    return vkBridge.send('VKWebAppGetUserInfo');
                })
                .then((data) => {
                    if (data && data.first_name) {
                        debugBox.innerHTML += `<br><br>👤 Привет, <strong>${data.first_name}</strong>!<br>Твой VK ID: ${data.id}`;
                    }
                })
                .catch((error) => {
                    console.error('Ошибка:', error);
                    statusText.textContent = '⚠️ Запущено (без данных пользователя)';
                });
        }

        function openBot() {
            // Открываем диалог с сообществом (замени 241157642 на реальный ID твоего сообщества, если он другой)
            vkBridge.send('VKWebAppOpenCommunityMessages', { 
                group_id: 241157642 
            }).catch(() => {
                alert('Не удалось открыть чат. Попробуйте найти бота в сообщениях сообщества вручную.');
            });
        }
        
        function showMap() {
            alert('Раздел с картой находится в разработке! Скоро здесь будет интерактивная карта АЗС.');
        }
    </script>
</body>
</html>
