<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заправки Рядом</title>
    <script src="https://vk.com/js/api/bridge.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #0077FF;
        }
        .btn {
            background: #0077FF;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
        }
        .btn:hover {
            background: #0055CC;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Заправки Рядом</h1>
        <p>Мониторинг наличия топлива на АЗС</p>

        <button class="btn" onclick="openBot()">📱 Открыть бота в VK</button>
        <button class="btn" onclick="showMap()">🗺️ Карта АЗС</button>

        <div id="content"></div>
    </div>

    <script>
        // Инициализация VK Bridge
        VKBridge.send('VKWebAppInit');

        function openBot() {
            // Открытие диалога с ботом
            VKBridge.send('VKWebAppOpenCodeReader');
            // Или переход в сообщество
            window.location.href = 'https://vk.com/ТВОЁ_СООБЩЕСТВО';
        }

        function showMap() {
            document.getElementById('content').innerHTML = '<p>Здесь будет карта с АЗС</p>';
        }
    </script>
</body>
</html>
