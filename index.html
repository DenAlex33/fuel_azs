<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Заправки Рядом</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=fb2c860a-11d4-4c8a-9634-414a348a395a&lang=ru_RU" type="text/javascript"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        :root {
            --primary: #0077FF; --primary-dark: #0055CC; --success: #34C759; --danger: #FF3B30;
            --warning: #FF9500; --bg: #F2F3F8; --card-bg: #FFFFFF; --text: #000000;
            --text-secondary: #8E8E93; --border: #E5E5EA; --shadow: rgba(0, 0, 0, 0.08);
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.dark-theme {
            --bg: #1C1C1E; --card-bg: #2C2C2E; --text: #FFFFFF; --text-secondary: #98989D;
            --border: #38383A; --shadow: rgba(0, 0, 0, 0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; padding: 0; transition: var(--transition);
            overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }

        .header { background: var(--card-bg); padding: 15px 20px; box-shadow: 0 2px 10px var(--shadow); position: sticky; top: 0; z-index: 100; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin: 0; }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { width: 40px; height: 40px; border: none; background: var(--bg); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; transition: var(--transition); position: relative; }
        .icon-btn:active { transform: scale(0.9); background: var(--border); }

        .user-bar { background: var(--card-bg); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .user-info { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px; position: relative; flex-shrink: 0; }
        .user-level { position: absolute; bottom: -2px; right: -2px; background: var(--warning); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 700; }
        .user-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-id { font-size: 12px; color: var(--text-secondary); }
        .user-points { text-align: right; flex-shrink: 0; }
        .points-value { font-size: 18px; font-weight: 700; color: var(--warning); }
        .points-label { font-size: 11px; color: var(--text-secondary); }

        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 16px; background: var(--card-bg); margin-bottom: 1px; }
        .stat-item { text-align: center; padding: 12px; background: var(--bg); border-radius: 12px; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

        .map-container { height: 50vh; min-height: 350px; position: relative; background: #e5e5e5; }
        #map { width: 100%; height: 100%; transition: filter 0.3s; }

        .map-controls { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 50; }
        .map-control-btn { width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--card-bg); box-shadow: 0 4px 12px var(--shadow); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: var(--transition); }
        .map-control-btn:active { transform: scale(0.9); }

        .side-panel { position: fixed; top: 0; right: -100%; width: 100%; max-width: 450px; height: 100vh; background: var(--card-bg); box-shadow: -4px 0 20px var(--shadow); z-index: 1000; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; overflow: hidden; }
        .side-panel.show { right: 0; }
        @media (max-width: 767px) { .side-panel { max-width: 100%; } .map-container { height: 40vh; min-height: 300px; } .map-controls { bottom: 12px; right: 12px; } .map-control-btn { width: 46px; height: 46px; font-size: 20px; } }

        .side-panel-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 999; opacity: 0; visibility: hidden; transition: all 0.3s; }
        .side-panel-overlay.show { opacity: 1; visibility: visible; }

        .panel-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: flex-start; background: var(--gradient); color: white; position: relative; }
        .panel-header-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .panel-header-content { flex: 1; }
        .panel-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .panel-address { font-size: 14px; opacity: 0.9; line-height: 1.4; }
        .panel-close { width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); border: none; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); flex-shrink: 0; }
        .panel-close:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.3); }
        .panel-header .btn-navi { margin-top: 16px; width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition); }
        .panel-header .btn-navi:active { transform: scale(0.98); background: var(--primary-dark); }
        .panel-content { flex: 1; overflow-y: auto; padding: 20px; }

        .fuel-card { background: var(--bg); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 2px solid var(--border); transition: var(--transition); cursor: pointer; }
        .fuel-card:active { transform: scale(0.98); background: var(--card-bg); }
        .fuel-card.available { border-color: var(--success); }
        .fuel-card.unavailable { border-color: var(--danger); opacity: 0.7; }
        .fuel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .fuel-type { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .fuel-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .fuel-status.available { background: rgba(52, 199, 89, 0.15); color: var(--success); }
        .fuel-status.unavailable { background: rgba(255, 59, 48, 0.15); color: var(--danger); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .fuel-price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .fuel-price { font-size: 28px; font-weight: 700; color: var(--text); }
        .fuel-limits-text { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .fuel-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--border); }

        .report-form { background: var(--bg); border-radius: 16px; padding: 16px; margin-top: 20px; }
        .form-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
        .form-input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; background: var(--card-bg); color: var(--text); transition: var(--transition); }
        .form-input:focus { border-color: var(--primary); }
        .form-textarea { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; background: var(--card-bg); color: var(--text); transition: var(--transition); resize: vertical; min-height: 80px; font-family: inherit; }
        .form-textarea:focus { border-color: var(--primary); }
        .radio-group { display: flex; gap: 12px; }
        .radio-option { flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: 12px; text-align: center; cursor: pointer; transition: var(--transition); background: var(--card-bg); font-weight: 600; }
        .radio-option:active { transform: scale(0.95); }
        .radio-option.selected { border-color: var(--success); background: var(--success); color: white; }
        .radio-option.selected.no { border-color: var(--danger); background: var(--danger); }
        .btn { padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition); width: 100%; }
        .btn:active { transform: scale(0.98); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-primary { background: var(--primary); color: white; }

        .comments-section { margin-top: 20px; }
        .comments-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
        .comment-item { background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .comment-user { font-size: 13px; font-weight: 600; }
        .comment-time { font-size: 12px; color: var(--text-secondary); }
        .comment-text { font-size: 14px; color: var(--text); line-height: 1.4; }
        .comment-queue { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

        .info-block { margin-top: 20px; background: var(--bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
        .info-header { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .info-content { display: none; margin-top: 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
        .info-content.show { display: block; }
        .info-arrow { margin-left: auto; transition: transform 0.3s; }
        .info-arrow.show { transform: rotate(180deg); }

        .confirm-block { margin-top: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px; padding: 20px; color: white; }
        .confirm-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .confirm-text { font-size: 14px; opacity: 0.9; margin-bottom: 16px; line-height: 1.4; }
        .confirm-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .confirm-btn { padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; transition: var(--transition); }
        .confirm-btn:active { transform: scale(0.95); }
        .confirm-btn-yes { background: white; color: var(--primary); }
        .confirm-btn-no { background: rgba(255,255,255,0.2); color: white; border: 2px solid white; }

        .nearby-section { margin-top: 20px; }
        .nearby-station-item { display: flex; align-items: center; padding: 12px; background: var(--bg); border-radius: 12px; margin-bottom: 8px; cursor: pointer; transition: var(--transition); }
        .nearby-station-item:active { transform: scale(0.98); background: var(--border); }
        .nearby-station-logo { width: 40px; height: 40px; border-radius: 8px; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; margin-right: 12px; flex-shrink: 0; }
        .nearby-station-info { flex: 1; min-width: 0; }
        .nearby-station-name { font-weight: 700; font-size: 15px; }
        .nearby-station-address { font-size: 12px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .nearby-station-distance { font-size: 14px; color: var(--text-secondary); margin-left: 12px; flex-shrink: 0; }

        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .btn-large { padding: 16px; font-size: 16px; }

        .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-radius: 20px 20px 0 0; padding: 20px; box-shadow: 0 -4px 20px var(--shadow); z-index: 100; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); max-height: 60vh; overflow-y: auto; }
        .bottom-sheet.show { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
        .tab { padding: 10px 16px; background: var(--bg); border: none; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: var(--transition); display: flex; align-items: center; gap: 6px; }
        .tab.active { background: var(--primary); color: white; }
        .tab-badge { background: var(--danger); color: white; padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; min-width: 20px; text-align: center; }
        .tab.active .tab-badge { background: white; color: var(--primary); }

        .station-item { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px var(--shadow); cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 12px; }
        .station-item:active { transform: scale(0.98); }
        .station-item.highlight { animation: highlightPulse 2s ease-out; border: 2px solid var(--warning); }
        @keyframes highlightPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 149, 0, 0.7); transform: scale(1.02); }
            50% { box-shadow: 0 0 20px 5px rgba(255, 149, 0, 0.3); }
            100% { box-shadow: 0 2px 8px var(--shadow); transform: scale(1); }
        }
        .station-item-logo { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; flex-shrink: 0; font-size: 18px; }
        .station-item-info { flex: 1; min-width: 0; }
        .station-item-name { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .station-item-address { font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .station-item-distance { font-size: 14px; color: var(--text-secondary); flex-shrink: 0; }
        .station-item-fuel { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .fuel-tag { padding: 6px 12px; background: var(--bg); border-radius: 8px; font-size: 13px; font-weight: 600; }
        .fuel-tag.available { background: rgba(52, 199, 89, 0.15); color: var(--success); }
        .favorite-icon { color: var(--danger); font-size: 16px; }

        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: var(--card-bg); padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 2000; opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); text-align: center; max-width: 90%; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--success); color: white; }
        .toast.error { background: var(--danger); color: white; }

        .favorite-notification {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 90%;
            border: 2px solid var(--danger);
        }
        .favorite-notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .favorite-notification-icon {
            font-size: 28px;
            animation: heartBeat 0.6s ease-out;
        }
        @keyframes heartBeat {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .favorite-notification-text {
            flex: 1;
            min-width: 0;
        }
        .favorite-notification-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
        }
        .favorite-notification-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .favorite-notification-btn {
            padding: 8px 14px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .favorite-notification-btn:active { transform: scale(0.95); }

        @media (min-width: 768px) { .bottom-sheet { display: none; } .side-panel { max-width: 450px; } }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        .achievement { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: linear-gradient(135deg, #FFD700, #FFA500); color: white; border-radius: 20px; font-size: 12px; font-weight: 600; margin: 4px; animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .empty-favorites {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .empty-favorites-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-favorites-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .empty-favorites-text {
            font-size: 14px;
            line-height: 1.5;
        }
        .empty-favorites-btn {
            margin-top: 20px;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="icon-btn" onclick="openAddStationModal()" title="Добавить АЗС">➕</button>
                <h1>⛽ Заправки Рядом</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleFavoritesPanel()" title="Избранное">
                    <span>❤️</span>
                    <span id="fav-badge" style="position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; display: none;">0</span>
                </button>
                <button class="icon-btn" onclick="toggleTheme()" title="Тема"><span id="header-theme-icon">🌙</span></button>
            </div>
        </div>
    </div>

    <div class="user-bar">
        <div class="user-info">
            <div class="user-avatar" id="user-avatar">👤<span class="user-level" id="user-level">1</span></div>
            <div style="min-width: 0;">
                <div class="user-name" id="user-name">Загрузка...</div>
                <div class="user-id" id="user-id">...</div>
            </div>
        </div>
        <div class="user-points">
            <div class="points-value" id="user-points">0</div>
            <div class="points-label">баллов</div>
        </div>
    </div>

    <div id="achievements" style="padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 4px;"></div>

    <div class="stats-bar">
        <div class="stat-item"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Всего АЗС</div></div>
        <div class="stat-item"><div class="stat-value" id="stat-available">0</div><div class="stat-label">Есть топливо</div></div>
        <div class="stat-item"><div class="stat-value" id="stat-reports">0</div><div class="stat-label">Отчётов</div></div>
    </div>

    <div class="map-container">
        <div id="map"></div>
        <div class="map-controls">
            <button class="map-control-btn" onclick="useMyLocation()" title="Моё местоположение"><span>📍</span></button>
        </div>
    </div>

    <div class="bottom-sheet" id="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="tabs">
            <button class="tab active" data-tab="search" onclick="switchTab('search')">🔍 Поиск</button>
            <button class="tab" data-tab="favorites" onclick="switchTab('favorites')">❤️ Избранное <span class="tab-badge" id="fav-count">0</span></button>
            <button class="tab" data-tab="achievements" onclick="switchTab('achievements')">🏆 Достижения</button>
        </div>
        <div id="tab-search">
            <button onclick="useMyLocation()" class="btn btn-primary" style="margin-bottom: 16px;">📍 Моё местоположение</button>
            <div id="stations-list-mobile"></div>
        </div>
        <div id="tab-favorites" style="display: none;">
            <div id="favorites-list" style="padding: 16px;">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
        <div id="tab-achievements" style="display: none;"></div>
    </div>

    <div class="favorite-notification" id="favorite-notification">
        <div class="favorite-notification-icon">❤️</div>
        <div class="favorite-notification-text">
            <div class="favorite-notification-title" id="fav-notif-title">Добавлено в избранное</div>
            <div class="favorite-notification-subtitle" id="fav-notif-subtitle">+5 баллов</div>
        </div>
        <button class="favorite-notification-btn" onclick="openFavoritesFromNotification()">Показать</button>
    </div>

    <div class="side-panel-overlay" id="panel-overlay" onclick="closeSidePanel()"></div>
    <div class="side-panel" id="side-panel">
        <div class="panel-header">
            <div class="panel-header-top">
                <div class="panel-header-content">
                    <div class="panel-title" id="panel-station-name">АЗС</div>
                    <div class="panel-address" id="panel-station-address">Адрес</div>
                </div>
                <button class="panel-close" onclick="closeSidePanel()">✕</button>
            </div>
            <button class="btn-navi" onclick="openYandexNavi(selectedStation?.lat, selectedStation?.lon)">🗺️ Поехали</button>
        </div>
        <div class="panel-content" id="panel-content"></div>
    </div>

    <div class="side-panel-overlay" id="add-station-overlay" onclick="closeAddStationModal()"></div>
    <div class="side-panel" id="add-station-panel">
        <div class="panel-header">
            <div class="panel-header-top">
                <div class="panel-header-content">
                    <div class="panel-title">➕ Добавить АЗС</div>
                    <div class="panel-address">Помогите другим водителям!</div>
                </div>
                <button class="panel-close" onclick="closeAddStationModal()">✕</button>
            </div>
        </div>
        <div class="panel-content">
            <div class="form-group">
                <label class="form-label">Название АЗС</label>
                <input type="text" id="new-station-name" class="form-input" placeholder="Например: Лукойл">
            </div>
            <div class="form-group">
                <label class="form-label">Адрес</label>
                <input type="text" id="new-station-address" class="form-input" placeholder="Введите адрес">
            </div>
            <div class="form-group">
                <label class="form-label">Координаты (широта, долгота)</label>
                <input type="text" id="new-station-coords" class="form-input" placeholder="55.751244, 37.618423">
            </div>
            <div class="form-group">
                <label class="form-label">Доступное топливо</label>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
                    <label style="display: flex; align-items: center; gap: 8px; padding: 12px; background: var(--bg); border-radius: 12px; cursor: pointer;">
                        <input type="checkbox" id="fuel-ai92" checked> АИ-92
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; padding: 12px; background: var(--bg); border-radius: 12px; cursor: pointer;">
                        <input type="checkbox" id="fuel-ai95" checked> АИ-95
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; padding: 12px; background: var(--bg); border-radius: 12px; cursor: pointer;">
                        <input type="checkbox" id="fuel-ai100"> АИ-100
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; padding: 12px; background: var(--bg); border-radius: 12px; cursor: pointer;">
                        <input type="checkbox" id="fuel-dt" checked> Дизель
                    </label>
                </div>
            </div>
            <div class="form-group" style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);">
                <label class="form-label">Лимиты по умолчанию (литры)</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div>
                        <label style="font-size: 12px; color: var(--text-secondary);">Минимум (0 = нет)</label>
                        <input type="number" id="new-limit-min" class="form-input" value="0" min="0" max="1000">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--text-secondary);">Максимум (0 = нет)</label>
                        <input type="number" id="new-limit-max" class="form-input" value="0" min="0" max="1000">
                    </div>
                </div>
            </div>
            <button class="btn btn-success" onclick="submitNewStation()">✅ Добавить АЗС (+20 баллов)</button>
        </div>
    </div>

    <!-- Отдельная панель для избранного -->
    <div class="side-panel-overlay" id="favorites-overlay" onclick="closeFavoritesPanel()"></div>
    <div class="side-panel" id="favorites-panel">
        <div class="panel-header" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
            <div class="panel-header-top">
                <div class="panel-header-content">
                    <div class="panel-title">❤️ Избранное</div>
                    <div class="panel-address" id="favorites-count">0 АЗС</div>
                </div>
                <button class="panel-close" onclick="closeFavoritesPanel()">✕</button>
            </div>
        </div>
        <div class="panel-content" id="favorites-content">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <div id="toast" class="toast"></div>



    <script>
        const API_URL = 'https://it-reutov.start-ovh.ru/api/index.php';
        let myMap, userData = null, userCoords = null, stations = [], selectedStation = null;
        let lastAddedFavoriteId = null;

        const STATION_LOGOS = {
            'Лукойл': { color: '#E31E24', icon: 'ЛУК' }, 'Газпромнефть': { color: '#00A651', icon: 'ГПН' },
            'Роснефть': { color: '#0055A5', icon: 'РН' }, 'Татнефть': { color: '#00A651', icon: 'ТН' },
            'Shell': { color: '#FFD500', icon: '🐚' }, 'BP': { color: '#00B04F', icon: 'BP' }, 'Трасса': { color: '#FF6B00', icon: 'ТР' }
        };

        const DEMO_STATIONS = [
            { id: '1', name: 'Лукойл', address: 'МКАД 2 км, вл5', lat: 55.752, lon: 37.574, fuels: { ai92: { price: 63.99, available: true, limit_min: 0, limit_max: 0 } }, reports: [], rating: 4.8 },
            { id: '2', name: 'Газпромнефть', address: 'ул. Победы, 29, Реутов', lat: 55.759, lon: 37.860, fuels: { ai95: { price: 70.20, available: false, limit_min: 30, limit_max: 50 } }, reports: [], rating: 4.5 }
        ];

        const storage = {
            get: (key, defaultValue) => { try { const item = localStorage.getItem(key); return item ? JSON.parse(item) : defaultValue; } catch { return defaultValue; } },
            set: (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error('Storage error:', e); } }
        };

        let userProfile = storage.get('userProfile', { points: 0, level: 1, achievements: [], reports: 0, favorites: [] });
        let allStations = [];
        let userReports = storage.get('userReports', []);

        if (storage.get('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            document.getElementById('header-theme-icon').textContent = '☀️';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            storage.set('theme', isDark ? 'dark' : 'light');
            document.getElementById('header-theme-icon').textContent = isDark ? '☀️' : '🌙';
            if (myMap) myMap.setType(isDark ? 'yandex#dark' : 'yandex#map');
            showToast(isDark ? '🌙 Тёмная тема' : '☀️ Светлая тема');
        }

        function updateUI() {
            const pointsEl = document.getElementById('user-points');
            const levelEl = document.getElementById('user-level');
            if (pointsEl) pointsEl.textContent = userProfile.points;
            if (levelEl) levelEl.textContent = userProfile.level;
            renderAchievements();
            updateStats();
            updateFavoriteBadge();
        }

        function updateFavoriteBadge() {
            const count = userProfile.favorites.length;

            const tabBadge = document.getElementById('fav-count');
            if (tabBadge) {
                tabBadge.textContent = count;
                tabBadge.style.display = count > 0 ? 'inline-block' : 'none';
            }

            const headerBadge = document.getElementById('fav-badge');
            if (headerBadge) {
                headerBadge.textContent = count;
                headerBadge.style.display = count > 0 ? 'inline-block' : 'none';
            }
        }

        function updateStats() {
            const totalStations = allStations.length;
            const availableStations = allStations.filter(s => Object.values(s.fuels).some(f => f.available)).length;
            const statTotal = document.getElementById('stat-total');
            const statAvailable = document.getElementById('stat-available');
            const statReports = document.getElementById('stat-reports');
            if (statTotal) statTotal.textContent = totalStations;
            if (statAvailable) statAvailable.textContent = availableStations;
            if (statReports) statReports.textContent = userProfile.reports;
        }

        function renderAchievements() {
            const container = document.getElementById('achievements');
            if (!container) return;
            const badges = { 'first_report': '🎯 Первый отчёт', '10_reports': '🔥 10 отчётов', 'helper': '🤝 Помощник', 'explorer': '🗺️ Исследователь' };
            container.innerHTML = userProfile.achievements.map(a => `<div class="achievement">${badges[a] || a}</div>`).join('');
        }

        function initMap() {
            return new Promise((resolve) => {
                if (typeof ymaps === 'undefined') {
                    console.warn('API Яндекс.Карт не загружен');
                    resolve();
                    return;
                }

                ymaps.ready(() => {
                    if (!myMap) {
                        try {
                            const isDark = document.body.classList.contains('dark-theme');
                            myMap = new ymaps.Map("map", {
                                center: [55.751244, 37.618423],
                                zoom: 10,
                                controls: ['zoomControl', 'geolocationControl'],
                                type: isDark ? 'yandex#dark' : 'yandex#map'
                            });

                            // Принудительно пересчитываем размеры контейнера, чтобы избежать багов рендера
                            setTimeout(() => {
                                if (myMap && myMap.container) {
                                    myMap.container.fitToViewport();
                                }
                            }, 300);

                        } catch (e) {
                            console.error('Ошибка инициализации карты:', e);
                        }
                    }
                    resolve();
                });
            });
        }

        async function loadStationsData() {
            try {
                const response = await fetch(`${API_URL}?action=get_stations`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.error) {
                    showToast("⚠️ Ошибка сервера", "error");
                    // Если ошибка сервера, используем localStorage
                    if (allStations.length > 0) {
                        updateStats();
                        renderAchievements();
                        updateUI();
                        loadStationsOnMap();
                        if (userCoords) searchStationsByCoords(userCoords.lat, userCoords.lon);
                    }
                } else {
                    allStations = data.stations || [];
                    // Сохраняем в localStorage
                    localStorage.setItem('allStations', JSON.stringify(allStations));
                }
            } catch (error) {
                // При ошибке сети используем localStorage
                console.log('Используем данные из localStorage');
                if (allStations.length > 0) {
                    updateStats();
                    loadStationsOnMap();
                }
            }

            updateStats();
            renderAchievements();
            updateUI();
            loadStationsOnMap();
            if (userCoords) searchStationsByCoords(userCoords.lat, userCoords.lon);
        }

        function getStationLogo(stationName) {
            for (const [name, logo] of Object.entries(STATION_LOGOS)) {
                if (stationName.toLowerCase().includes(name.toLowerCase())) return logo;
            }
            return { color: '#667eea', icon: '⛽' };
        }

        function createCustomPlacemark(station) {
            const logo = getStationLogo(station.name);
            const hasFuel = Object.values(station.fuels).some(f => f.available);
            const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="22" fill="${logo.color}" stroke="white" stroke-width="2"/>
                <text x="24" y="28" text-anchor="middle" fill="white" font-size="${logo.icon.length > 2 ? '10' : '14'}" font-weight="bold" font-family="Arial">${logo.icon}</text>
                ${hasFuel ? '<circle cx="36" cy="12" r="6" fill="#34C759" stroke="white" stroke-width="1.5"/>' : '<circle cx="36" cy="12" r="6" fill="#FF3B30" stroke="white" stroke-width="1.5"/>'}
            </svg>`;
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            return new ymaps.Placemark([station.lat, station.lon], {
                hintContent: `${station.name} - ${station.address}`,
                balloonContent: `<b>${station.name}</b><br>${station.address}<br>⭐ ${station.rating}`
            }, { preset: 'default#circle', iconImageHref: url, iconImageSize: [48, 48], iconImageOffset: [-24, -24] });
        }

        function loadStationsOnMap() {
            // Строгая проверка: если карта или её модуль геообъектов ещё не готовы, ждём и пробуем снова
            if (!myMap || !myMap.geoObjects) {
                console.warn('Карта ещё не полностью инициализирована, повторная попытка...');
                setTimeout(loadStationsOnMap, 300);
                return;
            }

            try {
                myMap.geoObjects.removeAll();

                // Даём карте 100мс на "дыхание" перед массовым добавлением сотен маркеров
                setTimeout(() => {
                    if (!myMap || !myMap.geoObjects) return;

                    allStations.forEach(station => {
                        const placemark = createCustomPlacemark(station);
                        placemark.events.add('click', () => { openStationPanel(station.id); });
                        myMap.geoObjects.add(placemark);
                    });
                }, 100);

            } catch (e) {
                console.error('Ошибка при добавлении АЗС на карту:', e);
            }
        }

        function openStationPanel(stationId) {
            const station = allStations.find(s => s.id == stationId);
            if (!station) return;
            selectedStation = station;
            document.getElementById('panel-station-name').textContent = `${station.name} ⭐ ${station.rating}`;
            document.getElementById('panel-station-address').textContent = station.address;
            renderPanelContent(station);
            document.getElementById('side-panel').classList.add('show');
            document.getElementById('panel-overlay').classList.add('show');
        }

        function closeSidePanel() {
            document.getElementById('side-panel').classList.remove('show');
            document.getElementById('panel-overlay').classList.remove('show');
        }

        function renderPanelContent(station) {
            const content = document.getElementById('panel-content');
            const nearbyStations = allStations.filter(s => s.id != station.id)
                .map(s => ({ ...s, distance: calculateDistance(station.lat, station.lon, s.lat, s.lon) }))
                .filter(s => s.distance <= 5).sort((a, b) => a.distance - b.distance).slice(0, 5);

            let fuelsHtml = '';
            Object.entries(station.fuels).forEach(([fuelType, fuel]) => {
                const fuelNames = { ai92: 'АИ-92', ai95: 'АИ-95', ai100: 'АИ-100', dt: 'ДТ' };

                const recentReports = station.reports?.filter(r => {
                    const reportTime = new Date(r.created_at.replace(' ', 'T') + 'Z').getTime();
                    return r.fuel_type === fuelType && (Date.now() - reportTime) < 24 * 60 * 60 * 1000;
                }) || [];

                const confirmations = recentReports.filter(r => r.status === 'available').length;
                const denials = recentReports.filter(r => r.status === 'unavailable').length;
                const totalVotes = confirmations + denials;

                let reliabilityText = '', reliabilityColor = '';
                if (totalVotes === 0) { reliabilityText = 'Нет подтверждений'; reliabilityColor = 'var(--text-secondary)'; }
                else if (totalVotes === 1) { reliabilityText = '1 подтверждение'; reliabilityColor = 'var(--warning)'; }
                else if (totalVotes < 5) { reliabilityText = `${totalVotes} подтверждения`; reliabilityColor = 'var(--warning)'; }
                else { reliabilityText = `${totalVotes} подтверждений`; reliabilityColor = 'var(--success)'; }

                let limitText = '';
                const min = fuel.limit_min || 0;
                const max = fuel.limit_max || 0;
                if (min > 0 && max > 0) limitText = `${min} – ${max} л`;
                else if (min > 0) limitText = `мин. ${min} л`;
                else if (max > 0) limitText = `макс. ${max} л`;
                else limitText = 'без лимита';

                fuelsHtml += `
                    <div class="fuel-card ${fuel.available ? 'available' : 'unavailable'}">
                        <div class="fuel-header">
                            <div class="fuel-type">${fuelNames[fuelType]}</div>
                            <div class="fuel-status ${fuel.available ? 'available' : 'unavailable'}">
                                <span class="status-dot"></span>${fuel.available ? 'Есть' : 'Нет'}
                            </div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <div class="fuel-limits-text" style="font-size: 13px;"> ${limitText}</div>
                            <div class="fuel-price" style="font-size: 24px;">${fuel.price.toFixed(2)} ₽</div>
                        </div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;">
                             Надёжность: <span style="color: ${reliabilityColor}; font-weight: 600;">${reliabilityText}</span>
                            ${confirmations > 0 ? `| ✅ ${confirmations} подтвердили` : ''}
                            ${denials > 0 ? `| ❌ ${denials} сообщили об отсутствии` : ''}
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                            <button class="btn btn-success" style="padding: 10px; font-size: 13px;" onclick="quickReport('${station.id}', '${fuelType}', true)">✅ Подтвердить</button>
                            <button class="btn btn-danger" style="padding: 10px; font-size: 13px;" onclick="quickReport('${station.id}', '${fuelType}', false)">❌ Сообщить об отсутствии</button>
                        </div>
                        <div style="margin-top: 8px; text-align: center;">
                            <button class="btn" style="padding: 8px; font-size: 12px; background: var(--bg); color: var(--text-secondary);" onclick="openReportForm('${station.id}', '${fuelType}')">📝 Развёрнутый отчёт</button>
                        </div>
                    </div>`;
            });

            let commentsHtml = '';
            const stationReports = station.reports || [];

            if (stationReports.length > 0) {
                const sortedReports = [...stationReports]
                    .sort((a, b) => {
                        const dateA = new Date(a.created_at.replace(' ', 'T') + 'Z').getTime();
                        const dateB = new Date(b.created_at.replace(' ', 'T') + 'Z').getTime();
                        return dateB - dateA;
                    })
                    .slice(0, 10);

                commentsHtml = '<div class="comments-section"><div class="comments-title">Последние отчёты</div>';
                sortedReports.forEach(report => {
                    commentsHtml += `
                        <div class="comment-item">
                            <div class="comment-header">
                                <span class="comment-user">${report.fuel_type.toUpperCase()}</span>
                                <span class="comment-time">${timeAgo(report.created_at)}</span>
                            </div>
                            <div class="comment-text">
                                ${report.status === 'available' ? '✅ Есть' : '❌ Нет'} | 💰 ${parseFloat(report.price).toFixed(2)} ₽
                            </div>
                            ${report.queue ? `<div class="comment-queue">🚗 ${getQueueText(report.queue)}</div>` : ''}
                            ${report.comment ? `<div class="comment-text" style="margin-top: 8px; font-style: italic;">"${report.comment}"</div>` : ''}
                        </div>`;
                });
                commentsHtml += '</div>';
            } else {
                commentsHtml = '<div class="comments-section"><div class="comments-title">📋 Последние отчёты</div><div class="loading" style="padding: 20px;">Пока нет отчётов. Будьте первым!</div></div>';
            }

            let nearbyHtml = '';
            if (nearbyStations.length > 0) {
                nearbyHtml = `<div class="nearby-section"><div class="comments-title">БЛИЖАЙШИЕ АЗС</div>` +
                    nearbyStations.map(s => {
                        const logo = getStationLogo(s.name);
                        return `<div class="nearby-station-item" onclick="openStationPanel('${s.id}')">
                            <div class="nearby-station-logo" style="background: ${logo.color}">${logo.icon}</div>
                            <div class="nearby-station-info"><div class="nearby-station-name">${s.name}</div><div class="nearby-station-address">${s.address}</div></div>
                            <div class="nearby-station-distance">${s.distance < 1 ? `${(s.distance * 1000).toFixed(0)} м` : `${s.distance.toFixed(1)} км`} ›</div>
                        </div>`;
                    }).join('') + `</div>`;
            }

            const isFavorite = userProfile.favorites.includes(station.id);
            content.innerHTML = `${fuelsHtml}${commentsHtml}${nearbyHtml}
                <div class="info-block">
                    <div class="info-header" onclick="toggleInfoBlock()"><span>ℹ️</span><span>Информация справочная</span><span class="info-arrow" id="info-arrow">▼</span></div>
                    <div class="info-content" id="info-content">
                        <p>Доступность определяется на основе отчётов пользователей.</p>
                    </div>
                </div>
                <div class="confirm-block">
                    <div class="confirm-title">Подтвердите данные</div>
                    <div class="confirm-text">Помогите поддерживать информацию актуальной.</div>
                    <div class="confirm-buttons">
                        <button class="confirm-btn confirm-btn-yes" onclick="confirmData('${station.id}', true)">Да</button>
                        <button class="confirm-btn confirm-btn-no" onclick="confirmData('${station.id}', false)">Нет</button>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="btn ${isFavorite ? 'btn-danger' : 'btn-primary'} btn-large" onclick="toggleFavorite('${station.id}')">${isFavorite ? '💔 Убрать из избранного' : '❤️ В избранное'}</button>
                </div>`;
        }

        function toggleInfoBlock() {
            const content = document.getElementById('info-content');
            const arrow = document.getElementById('info-arrow');
            content.classList.toggle('show');
            arrow.classList.toggle('show');
        }

        function confirmData(stationId, confirmed) {
            showToast(confirmed ? '✅ Спасибо! +5 баллов' : '❌ Не подтверждено', 'success');
            addPoints(5);
        }

        function getQueueText(queue) {
            const queues = { no_queue: 'Нет очереди', small: '1-3 машины', medium: '4-7 машин', large: '8+ машин' };
            return queues[queue] || queue;
        }

        function openReportForm(stationId, fuelType) {
            const station = allStations.find(s => s.id == stationId);
            if (!station) return;
            const fuel = station.fuels[fuelType];
            const fuelNames = { ai92: 'АИ-92', ai95: 'АИ-95', ai100: 'АИ-100', dt: 'ДТ' };
            const limitMin = fuel.limit_min || 0;
            const limitMax = fuel.limit_max || 0;

            document.getElementById('panel-content').innerHTML = `
                <div class="report-form">
                    <div class="form-title">📝 Отчёт: ${fuelNames[fuelType]}</div>
                    <div class="form-group">
                        <label class="form-label">Статус топлива</label>
                        <div class="radio-group">
                            <div class="radio-option selected" onclick="selectReportType(this, 'available')">✅ Есть</div>
                            <div class="radio-option no" onclick="selectReportType(this, 'unavailable')">❌ Нет</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Цена (₽)</label>
                        <input type="number" id="report-price" class="form-input" value="${fuel.price}" step="0.01">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Лимиты заправки (литры)</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div>
                                <label style="font-size: 12px; color: var(--text-secondary);">Минимум</label>
                                <input type="number" id="report-limit-min" class="form-input" value="${limitMin}" min="0" max="1000" placeholder="0">
                            </div>
                            <div>
                                <label style="font-size: 12px; color: var(--text-secondary);">Максимум</label>

        async function submitReport(stationId, fuelType) {
            const station = allStations.find(s => s.id == stationId);
            if (!station) return;
            const price = parseFloat(document.getElementById('report-price').value);
            const queue = document.getElementById('report-queue').value;
            const comment = document.getElementById('report-comment').value.trim();
            const isAvailable = document.querySelector('.radio-option.selected')?.textContent.includes('Есть');
            const limitMin = parseInt(document.getElementById('report-limit-min').value) || 0;
            const limitMax = parseInt(document.getElementById('report-limit-max').value) || 0;

            if (isNaN(price) || price <= 0) { showToast('❌ Введите корректную цену', 'error'); return; }
            if (limitMin > 0 && limitMax > 0 && limitMin > limitMax) { showToast('❌ Мин. лимит > макс.', 'error'); return; }

            try {
                showToast('⏳ Отправка...');
                const response = await fetch(`${API_URL}?action=add_report`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        station_id: stationId, user_id: userData?.id || 'guest', fuel_type: fuelType,
                        status: isAvailable ? 'available' : 'unavailable', price: price,
                        limit_min: limitMin, limit_max: limitMax, queue: queue, comment: comment
                    })
                });
                const result = await response.json();
                if (result.success) {
                    showToast('✅ Отчёт отправлен! +10 баллов', 'success');
                    addPoints(10);
                    userProfile.reports++;
                    if (userProfile.reports === 1) unlockAchievement('first_report');
                    if (userProfile.reports === 10) unlockAchievement('10_reports');
                    storage.set('userProfile', userProfile);
                    await loadStationsData();
                } else {
                    showToast('❌ Ошибка: ' + (result.error || ''), 'error');
                }
            } catch (e) {
                showToast('❌ Ошибка сети', 'error');
            }
        }

        async function useMyLocation() {
            showToast('📍 Определяем местоположение...');
            let gotLocation = false;
            try {
                const data = await vkBridge.send('VKWebAppGetLocation');
                if (data && data.lat) { userCoords = { lat: data.lat, lon: data.lon }; await searchStationsByCoords(data.lat, data.lon); gotLocation = true; }
            } catch (e) { console.error('VK geo error:', e); }
            if (!gotLocation && navigator.geolocation) {
                try {
                    const position = await new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000 }));
                    userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
                    await searchStationsByCoords(userCoords.lat, userCoords.lon);
                    gotLocation = true;
                } catch (error) { console.error('Browser geo error:', error); }
            }
            if (!gotLocation) {
                userCoords = { lat: 55.7558, lon: 37.6173 };
                await searchStationsByCoords(55.7558, 37.6173);
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function searchStationsByCoords(lat, lon) {
            if (myMap) myMap.setCenter([lat, lon], 13);
            stations = allStations.map(s => ({ ...s, distance: calculateDistance(lat, lon, s.lat, s.lon) })).filter(s => s.distance <= 10).sort((a, b) => a.distance - b.distance);
            renderStationsList(stations);
        }

                    </div>

        function timeAgo(timestamp) {
            if (!timestamp) return 'только что';
            let date;
            if (typeof timestamp === 'string') {
                const isoString = timestamp.replace(' ', 'T') + 'Z';
                date = new Date(isoString);
            } else {
                date = new Date(timestamp);
            }

            if (isNaN(date.getTime())) return 'только что';

            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 60) return 'только что';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} мин назад`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ч назад`;
            const days = Math.floor(hours / 24);
            if (days < 30) return `${days} дн назад`;
            return `${Math.floor(days / 30)} мес назад`;
        }

                        </div>
                        <button class="btn btn-danger" style="padding: 8px 12px; font-size: 12px; width: auto; flex-shrink: 0;" onclick="event.stopPropagation(); toggleFavorite('${station.id}')">Убрать</button>
                    </div>`;
                }).join('');
            }

            panel.classList.add('show');
            overlay.classList.add('show');
        }

        function addPoints(points) {
            userProfile.points += points;
            const newLevel = Math.floor(userProfile.points / 100) + 1;
            if (newLevel > userProfile.level) { userProfile.level = newLevel; showToast(`🎉 Уровень ${newLevel}!`); }
            storage.set('userProfile', userProfile);
            updateUI();
        }

        function unlockAchievement(id) {
            if (!userProfile.achievements.includes(id)) {
                userProfile.achievements.push(id);
                storage.set('userProfile', userProfile);
                updateUI();
                showToast('🏆 Достижение!');
            }
        }

        function openAddStationModal() {
            document.getElementById('add-station-panel').classList.add('show');
            document.getElementById('add-station-overlay').classList.add('show');
        }

        function closeAddStationModal() {
            document.getElementById('add-station-panel').classList.remove('show');
            document.getElementById('add-station-overlay').classList.remove('show');
        }

        async function submitNewStation() {
            const name = document.getElementById('new-station-name').value.trim();
            const address = document.getElementById('new-station-address').value.trim();
            const coords = document.getElementById('new-station-coords').value.trim();
            if (!name || !address || !coords) { showToast('❌ Заполните все поля', 'error'); return; }
            const [lat, lon] = coords.split(',').map(c => parseFloat(c.trim()));
            if (isNaN(lat) || isNaN(lon)) { showToast('❌ Неверный формат координат', 'error'); return; }

            const limitMin = parseInt(document.getElementById('new-limit-min').value) || 0;
            const limitMax = parseInt(document.getElementById('new-limit-max').value) || 0;

            const fuels = {};
            const basePrices = { ai92: 63.99, ai95: 69.69, ai100: 79.99, dt: 75.50 };
            ['ai92', 'ai95', 'ai100', 'dt'].forEach(fuelType => {
                if (document.getElementById(`fuel-${fuelType}`).checked) {
                    fuels[fuelType] = { price: basePrices[fuelType], available: true, limit_min: limitMin, limit_max: limitMax };
                }
            });

            try {
                showToast('💾 Сохранение...');
                const response = await fetch(`${API_URL}?action=add_station`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, address, lat, lon, brand: name, fuels, user_id: userData?.id || 'guest' })
                });
                const result = await response.json();
                if (result.success) {
                    showToast('✅ АЗС добавлена! +20 баллов', 'success');
                    addPoints(20);
                    unlockAchievement('explorer');
                    closeAddStationModal();
                    document.getElementById('new-station-name').value = '';
                    document.getElementById('new-station-address').value = '';
                    document.getElementById('new-station-coords').value = '';
                    document.getElementById('new-limit-min').value = '0';
                    document.getElementById('new-limit-max').value = '0';
                    await loadStationsData();
                } else {
                    showToast('❌ Ошибка: ' + (result.error || ''), 'error');
                }
            } catch (e) {
                showToast('❌ Ошибка сети', 'error');
            }
        }

        function openYandexNavi(lat, lon) {
            if (!lat || !lon) { showToast('❌ Нет координат', 'error'); return; }

            const userLat = userCoords?.lat || 55.7558;
            const userLon = userCoords?.lon || 37.6173;
            const mapsUrl = `https://yandex.ru/maps/?rtext=${userLat},${userLon}~${lat},${lon}&rtt=auto`;

            const link = document.createElement('a');
            link.href = mapsUrl;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function renderFavorites() {
            const container = document.getElementById('tab-favorites');
            const favStations = allStations.filter(s => userProfile.favorites.includes(s.id));

            if (favStations.length === 0) {
                container.innerHTML = `
                    <div class="empty-favorites">
                        <div class="empty-favorites-icon">❤️</div>
                        <div class="empty-favorites-title">Пока пусто</div>
                        <div class="empty-favorites-text">Нажмите "❤️ В избранное" на карточке АЗС,<br>чтобы добавить её сюда</div>
                        <button class="empty-favorites-btn" onclick="switchTab('search')">🔍 Найти АЗС</button>
                    </div>`;
                return;
            }

            container.innerHTML = favStations.map(station => {
                const logo = getStationLogo(station.name);
                const isLastAdded = station.id === lastAddedFavoriteId;
                return `<div class="station-item ${isLastAdded ? 'highlight' : ''}" onclick="openStationPanel('${station.id}')">
                    <div class="station-item-logo" style="background: ${logo.color}">${logo.icon}</div>
                    <div class="station-item-info">
                        <div class="station-item-name">${station.name} ⭐ ${station.rating} <span class="favorite-icon">❤️</span></div>
                        <div class="station-item-address">${station.address}</div>
                        <div class="station-item-fuel">${Object.entries(station.fuels).map(([type, fuel]) => `<span class="fuel-tag ${fuel.available ? 'available' : ''}">${type.toUpperCase()}: ${fuel.price.toFixed(0)}₽</span>`).join('')}</div>
                    </div>
                    <button class="btn btn-danger" style="padding: 8px 12px; font-size: 12px; width: auto; flex-shrink: 0;" onclick="event.stopPropagation(); toggleFavorite('${station.id}')">Убрать</button>
                </div>`;
            }).join('');

            if (lastAddedFavoriteId) {
                setTimeout(() => {
                    const highlightEl = container.querySelector('.station-item.highlight');
                    if (highlightEl) {
                        highlightEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        setTimeout(() => {
                            highlightEl.classList.remove('highlight');
                            lastAddedFavoriteId = null;
                        }, 3000);
                    }
                }, 100);
            }
        }

        function renderAllAchievements() {
            const container = document.getElementById('tab-achievements');
            const allAchievements = [
                { id: 'first_report', name: '🎯 Первый отчёт', desc: 'Отправьте первый отчёт', unlocked: userProfile.achievements.includes('first_report') },
                { id: '10_reports', name: '🔥 10 отчётов', desc: 'Отправьте 10 отчётов', unlocked: userProfile.achievements.includes('10_reports') },
                { id: 'helper', name: '🤝 Помощник', desc: 'Помогите 50 пользователям', unlocked: userProfile.achievements.includes('helper') },
                { id: 'explorer', name: '🗺️ Исследователь', desc: 'Добавьте АЗС на карту', unlocked: userProfile.achievements.includes('explorer') }
            ];
            container.innerHTML = allAchievements.map(a => `<div style="padding: 16px; background: ${a.unlocked ? 'var(--success)' : 'var(--bg)'}; border-radius: 12px; margin-bottom: 12px; color: ${a.unlocked ? 'white' : 'var(--text)'};">
                <div style="font-weight: 600; font-size: 16px; margin-bottom: 4px;">${a.name}</div><div style="font-size: 13px; opacity: 0.9;">${a.desc}</div>
                <div style="font-size: 12px; margin-top: 8px; opacity: 0.8;">${a.unlocked ? '✅ Получено' : '🔒 Заблокировано'}</div></div>`).join('');
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message; toast.className = 'toast ' + type; toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function startApp() {
            try {
                await vkBridge.send('VKWebAppInit');
                const data = await vkBridge.send('VKWebAppGetUserInfo');
                if (data) {
                    userData = data;
                    document.getElementById('user-name').textContent = `${data.first_name} ${data.last_name}`;
                    document.getElementById('user-id').textContent = `ID: ${data.id}`;
                    document.getElementById('user-avatar').innerHTML = `${data.first_name[0]}${data.last_name[0]}<span class="user-level">${userProfile.level}</span>`;
                }
            } catch (e) {
                document.getElementById('user-name').textContent = 'Гость';
            }
            updateUI();
            await initMap();
            await loadStationsData();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startApp);
        } else {
            startApp();
        }
    </script>
</body>
</html>
