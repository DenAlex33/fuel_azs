<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заправки Рядом</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0077FF;
            --primary-dark: #0055CC;
            --success: #34C759;
            --danger: #FF3B30;
            --warning: #FF9500;
            --bg: #F2F3F8;
            --card-bg: #FFFFFF;
            --text: #000000;
            --text-secondary: #8E8E93;
            --border: #E5E5EA;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
            -webkit-font-smoothing: antialiased;
        }

        /* Header с градиентом */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 20px 35px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
            font-weight: 400;
        }

        /* Карточка пользователя */
        .user-card {
            background: var(--card-bg);
            margin: -20px 15px 20px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 2;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 600;
        }

        .user-details h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .user-details p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 119, 255, 0.3);
        }

        .btn-primary:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 119, 255, 0.4);
        }

        /* Секции */
        .section {
            background: var(--card-bg);
            margin: 0 15px 20px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 2px;
        }

        /* Поле поиска */
        .search-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            background: var(--bg);
        }

        .search-input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 119, 255, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .btn-search {
            width: 100%;
            margin-top: 12px;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 119, 255, 0.3);
        }

        .btn-search:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 119, 255, 0.4);
        }

        /* Выбор топлива */
        .fuel-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .fuel-card {
            padding: 16px;
            border: 2px solid var(--border);
            background: var(--bg);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .fuel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .fuel-card.active::before {
            opacity: 1;
        }

        .fuel-card-content {
            position: relative;
            z-index: 1;
        }

        .fuel-card.active .fuel-card-content {
            color: white;
        }

        .fuel-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .fuel-name {
            font-size: 15px;
            font-weight: 600;
        }

        .fuel-card.active {
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(0, 119, 255, 0.2);
        }

        /* Карта */
        .map-wrapper {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            height: 300px;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Карточка АЗС */
        .station-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .station-card:active {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .station-name {
            font-size: 17px;
            font-weight: 600;
            flex: 1;
            margin-right: 10px;
        }

        .station-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-available {
            background: rgba(52, 199, 89, 0.15);
            color: var(--success);
        }

        .status-unavailable {
            background: rgba(255, 59, 48, 0.15);
            color: var(--danger);
        }

        .status-unknown {
            background: rgba(255, 149, 0, 0.15);
            color: var(--warning);
        }

        .station-address {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .report-actions {
            display: flex;
            gap: 10px;
        }

        .btn-report {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-report-available {
            background: var(--success);
            color: white;
        }

        .btn-report-available:active {
            background: #2DB84F;
            transform: scale(0.98);
        }

        .btn-report-unavailable {
            background: var(--danger);
            color: white;
        }

        .btn-report-unavailable:active {
            background: #E6352B;
            transform: scale(0.98);
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
            gap: 20px;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Toast уведомления */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            color: white;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: rgba(52, 199, 89, 0.9);
        }

        .toast.error {
            background: rgba(255, 59, 48, 0.9);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 16px;
            font-weight: 500;
        }

        /* Адаптивность */
        @media (max-width: 375px) {
            .header h1 {
                font-size: 22px;
            }
            
            .fuel-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Скрытые элементы */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <h1>⛽ Заправки Рядом</h1>
            <p>Мониторинг топлива в реальном времени</p>
        </div>
    </div>

    <!-- User Card -->
    <div class="user-card">
        <div class="user-info">
            <div class="user-avatar" id="user-avatar">👤</div>
            <div class="user-details">
                <h3 id="user-name">Загрузка...</h3>
                <p>ID: <span id="user-id">...</span></p>
            </div>
        </div>
        <button class="btn-primary" onclick="openBot()">💬 Чат с ботом</button>
    </div>

    <!-- Search Section -->
    <div class="section">
        <div class="section-title">🔍 Поиск АЗС</div>
        <div class="search-wrapper">
            <input 
                type="text" 
                id="city-input" 
                class="search-input" 
                placeholder="Введите город или район..."
            >
            <button class="btn-search" onclick="searchStations()">
                 Найти заправки
            </button>
        </div>
    </div>

    <!-- Fuel Selector -->
    <div class="section">
        <div class="section-title">⛽ Тип топлива</div>
        <div class="fuel-grid">
            <div class="fuel-card" data-fuel="ai92" onclick="selectFuel('ai92')">
                <div class="fuel-card-content">
                    <div class="fuel-icon">92</div>
                    <div class="fuel-name">АИ-92</div>
                </div>
            </div>
            <div class="fuel-card" data-fuel="ai95" onclick="selectFuel('ai95')">
                <div class="fuel-card-content">
                    <div class="fuel-icon">95</div>
                    <div class="fuel-name">АИ-95</div>
                </div>
            </div>
            <div class="fuel-card" data-fuel="ai100" onclick="selectFuel('ai100')">
                <div class="fuel-card-content">
                    <div class="fuel-icon">100</div>
                    <div class="fuel-name">АИ-100</div>
                </div>
            </div>
            <div class="fuel-card" data-fuel="dt" onclick="selectFuel('dt')">
                <div class="fuel-card-content">
                    <div class="fuel-icon">⛽</div>
                    <div class="fuel-name">ДТ</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Map -->
    <div class="section">
        <div class="section-title">🗺️ Карта</div>
        <div class="map-wrapper">
            <div id="map"></div>
        </div>
    </div>

    <!-- Stations List -->
    <div class="section" id="stations-list" style="display: none;">
        <div class="section-title">📍 Найдено АЗС</div>
        <div id="stations-content"></div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Ищем заправки...</div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        let myMap;
        let selectedFuel = null;
        let userData = null;
        const BACKEND_URL = 'http://localhost:8000'; // Замени на свой URL

        // Инициализация VK Bridge
        vkBridge.subscribe((event) => {
            console.log('VK Bridge event:', event);
        });

        // Инициализация приложения
        vkBridge.send('VKWebAppInit')
            .then(() => {
                console.log('VK Bridge initialized');
                return vkBridge.send('VKWebAppGetUserInfo');
            })
            .then((data) => {
                if (data) {
                    userData = data;
                    document.getElementById('user-name').textContent = `${data.first_name} ${data.last_name}`;
                    document.getElementById('user-id').textContent = data.id;
                    document.getElementById('user-avatar').textContent = `${data.first_name[0]}${data.last_name[0]}`;
                }
                initMap();
            })
            .catch((error) => {
                console.error('Ошибка инициализации:', error);
                document.getElementById('user-name').textContent = 'Пользователь';
                initMap();
            });

        // Инициализация карты
        function initMap() {
            ymaps.ready(function () {
                myMap = new ymaps.Map("map", {
                    center: [55.751244, 37.618423],
                    zoom: 10,
                    controls: ['zoomControl', 'geolocationControl']
                });
            });
        }

        // Выбор топлива
        function selectFuel(fuelType) {
            selectedFuel = fuelType;
            document.querySelectorAll('.fuel-card').forEach(card => {
                card.classList.remove('active');
            });
            document.querySelector(`[data-fuel="${fuelType}"]`).classList.add('active');
            showToast(`Выбрано топливо: ${getFuelName(fuelType)}`, 'success');
        }

        // Получить название топлива
        function getFuelName(fuelType) {
            const names = {
                'ai92': 'АИ-92',
                'ai95': 'АИ-95',
                'ai100': 'АИ-100',
                'dt': 'ДТ'
            };
            return names[fuelType] || fuelType;
        }

        // Поиск АЗС
        async function searchStations() {
            const city = document.getElementById('city-input').value.trim();
            if (!city) {
                showToast('Введите название города', 'error');
                return;
            }

            if (!selectedFuel) {
                showToast('Выберите тип топлива', 'error');
                return;
            }

            document.getElementById('loading').classList.add('show');
            document.getElementById('stations-list').style.display = 'none';

            try {
                const response = await fetch(`${BACKEND_URL}/api/search?city=${encodeURIComponent(city)}&fuel=${selectedFuel}`);

                if (response.ok) {
                    const stations = await response.json();
                    displayStations(stations);
                } else {
                    showToast('Ошибка при поиске', 'error');
                }
            } catch (error) {
                console.error('Ошибка поиска:', error);
                showToast('Ошибка соединения', 'error');
            } finally {
                document.getElementById('loading').classList.remove('show');
            }
        }

        // Отображение АЗС
        function displayStations(stations) {
            const container = document.getElementById('stations-content');
            container.innerHTML = '';

            if (stations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"></div>
                        <div class="empty-text">АЗС не найдены</div>
                    </div>
                `;
                document.getElementById('stations-list').style.display = 'block';
                return;
            }

            stations.forEach((station) => {
                const card = createStationCard(station);
                container.appendChild(card);

                // Добавляем метку на карту
                if (myMap && station.lat && station.lon) {
                    const statusColors = {
                        'available': 'green',
                        'unavailable': 'red',
                        'unknown': 'blue'
                    };
                    const color = statusColors[station.status] || 'blue';
                    
                    const placemark = new ymaps.Placemark(
                        [station.lat, station.lon],
                        {
                            hintContent: station.name,
                            balloonContent: `
                                <b>${station.name}</b><br>
                                ${station.address}<br>
                                ${getStatusText(station.status)}
                            `
                        },
                        {
                            preset: `islands#${color}GasStationIcon`
                        }
                    );
                    myMap.geoObjects.add(placemark);
                }
            });

            document.getElementById('stations-list').style.display = 'block';
            
            // Центрируем карту на первой АЗС
            if (stations.length > 0 && myMap) {
                myMap.setCenter([stations[0].lat, stations[0].lon], 14);
            }
        }

        // Создание карточки АЗС
        function createStationCard(station) {
            const card = document.createElement('div');
            card.className = 'station-card';

            const statusText = getStatusText(station.status);
            const statusClass = `status-${station.status}`;

            card.innerHTML = `
                <div class="station-header">
                    <div class="station-name">${station.name}</div>
                    <span class="station-status ${statusClass}">${statusText}</span>
                </div>
                <div class="station-address"> ${station.address}</div>
                <div class="report-actions">
                    <button class="btn-report btn-report-available" onclick="reportFuel('${station.id}', '${selectedFuel}', 'available')">
                        ✅ Есть
                    </button>
                    <button class="btn-report btn-report-unavailable" onclick="reportFuel('${station.id}', '${selectedFuel}', 'unavailable')">
                        ❌ Нет
                    </button>
                </div>
            `;

            return card;
        }

        // Получить текст статуса
        function getStatusText(status) {
            const texts = {
                'available': '✅ Есть',
                'unavailable': '❌ Нет',
                'unknown': '❓ Неизвестно'
            };
            return texts[status] || '❓ Неизвестно';
        }

        // Отправка отчёта
        async function reportFuel(stationId, fuelType, status) {
            if (!userData) {
                showToast('Авторизуйтесь через VK', 'error');
                return;
            }

            const statusText = status === 'available' ? 'наличие' : 'отсутствие';

            try {
                const response = await fetch(`${BACKEND_URL}/api/report`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        vk_id: userData.id,
                        station_id: stationId,
                        fuel_type: fuelType,
                        status: status
                    })
                });

                if (response.ok) {
                    showToast(`Отчёт принят! Спасибо!`, 'success');
                    searchStations(); // Обновляем данные
                } else {
                    showToast('Ошибка отправки', 'error');
                }
            } catch (error) {
                console.error('Ошибка отчёта:', error);
                showToast('Ошибка соединения', 'error');
            }
        }

        // Toast уведомления
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Открыть чат с ботом
        function openBot() {
            vkBridge.send('VKWebAppOpenCommunityMessages', { 
                group_id: 241157642 
            }).catch(() => {
                showToast('Откройте сообщения вручную', 'error');
            });
        }

        // Поиск по Enter
        document.getElementById('city-input')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchStations();
            }
        });
    </script>
</body>
</html>
